<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>中文发音评测 · 轻量版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto;
            background: #f6f8fc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .app {
            max-width: 860px;
            width: 100%;
            background: #fff;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.07);
            overflow: hidden;
            padding: 28px 32px 36px;
        }
        /* 头部 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .title { font-size: 22px; font-weight: 700; color: #0f172a; display: flex; align-items: center; gap: 8px; }
        .title span { background: #16a34a; color: #fff; font-size: 14px; padding: 0 12px; border-radius: 20px; }
        /* 输入区 */
        .input-section { margin-bottom: 20px; }
        .input-label { font-size: 14px; font-weight: 600; color: #334155; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .hint { color: #94a3b8; font-weight: 400; font-size: 13px; }
        textarea {
            width: 100%;
            min-height: 80px;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 16px;
            resize: vertical;
            transition: 0.2s;
        }
        textarea:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59,130,246,0.08); }
        /* 结果区 */
        .result-area { margin-top: 20px; min-height: 120px; }
        .result-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; background: #f8fafc; border-radius: 20px; border: 2px dashed #e2e8f0; color: #94a3b8; }
        .result-card { background: #f8fafc; border-radius: 20px; padding: 24px; border: 1px solid #eef2f6; display: none; }
        .score-row { display: flex; align-items: center; gap: 24px; margin-bottom: 20px; }
        .score-circle {
            width: 90px; height: 90px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-weight: 700; font-size: 32px; color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,0.08);
        }
        .score-label { font-size: 12px; opacity: 0.9; margin-top: 4px; }
        .score-details { flex: 1; }
        .level { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .accuracy { color: #64748b; font-size: 14px; }
        .progress-bar { height: 6px; background: #e2e8f0; border-radius: 10px; margin-top: 12px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 10px; background: linear-gradient(90deg, #3b82f6, #8b5cf6); transition: width 0.6s ease; }
        /* 逐字评分 */
        .char-scores { display: flex; flex-wrap: wrap; gap: 12px; margin: 20px 0; }
        .char-item {
            padding: 12px 16px; border-radius: 12px; min-width: 70px; text-align: center;
            background: #fff; border: 1px solid #e2e8f0;
        }
        .char-item.good { border-color: #16a34a; background: #f0fdf4; }
        .char-item.warn { border-color: #eab308; background: #fefce8; }
        .char-item.bad { border-color: #dc2626; background: #fef2f2; }
        .char { font-size: 20px; font-weight: 700; }
        .pinyin { font-size: 13px; color: #64748b; margin: 4px 0; }
        .char-score { font-size: 14px; font-weight: 600; }
        /* 建议区 */
        .suggest-box { margin-top: 20px; padding: 16px 20px; background: #f1f5f9; border-radius: 16px; border-left: 4px solid #3b82f6; }
        .suggest-title { font-weight: 600; font-size: 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .suggest-list { font-size: 14px; line-height: 1.7; color: #334155; }
        .suggest-list li { padding: 4px 0; border-bottom: 1px solid #e2e8f0; }
        .suggest-list li:last-child { border-bottom: none; }
        /* 按钮区 */
        .actions { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
        .btn {
            padding: 12px 28px; border: none; border-radius: 40px; font-weight: 600; font-size: 15px;
            cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .btn-primary { background: #0f172a; color: #fff; }
        .btn-primary:hover { background: #1e293b; }
        .btn-blue { background: #3b82f6; color: #fff; }
        .btn-blue:hover { background: #2563eb; }
        .btn-outline { background: transparent; border: 2px solid #e2e8f0; color: #1e293b; }
        .btn-outline:hover { background: #f8fafc; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        /* 录音状态 */
        .recording-status { display: none; align-items: center; gap: 10px; color: #dc2626; padding: 6px 16px; border-radius: 40px; background: #fef2f2; border: 1px solid #fecaca; }
        .recording-dot { width: 12px; height: 12px; border-radius: 50%; background: #dc2626; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
        /* 波形动画 */
        .wave-container { display: none; align-items: center; gap: 8px; margin-top: 12px; }
        .wave-bar { width: 4px; height: 20px; background: #3b82f6; border-radius: 2px; animation: wave 1.2s infinite ease-in-out; }
        .wave-bar:nth-child(2) { animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { animation-delay: 0.4s; }
        @keyframes wave { 0%,100% { height: 20px; } 50% { height: 40px; } }
        /* 提示框 */
        .tip-box { margin-top: 20px; padding: 12px 16px; background: #f0f9ff; border-radius: 12px; border-left: 4px solid #0ea5e9; font-size: 13px; color: #0369a1; }
        /* 响应式 */
        @media (max-width: 640px) {
            .app { padding: 18px 16px; border-radius: 24px; }
            .score-circle { width: 70px; height: 70px; font-size: 26px; }
            .actions { flex-direction: column; }
            .btn { justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- 头部 -->
        <div class="header">
            <div class="title">🎙️ 发音评测 <span>轻量版</span></div>
        </div>

        <!-- 输入区 -->
        <div class="input-section">
            <div class="input-label">
                <span>📝 输入测评内容</span>
                <span class="hint">支持单字/词语/句子，如「中国加油」</span>
            </div>
            <textarea id="inputText" placeholder="请输入要测评的中文内容...">中国加油</textarea>
        </div>

        <!-- 结果区 -->
        <div class="result-area">
            <div class="result-placeholder" id="placeholder">
                <div style="font-size: 40px; margin-bottom: 10px;">🎤</div>
                <p>输入内容后点击「开始录音」即可评测</p>
            </div>
            <div class="result-card" id="resultCard">
                <div class="score-row">
                    <div class="score-circle" id="scoreCircle">
                        <span id="scoreNum">0</span>
                        <span class="score-label">评分</span>
                    </div>
                    <div class="score-details">
                        <div class="level" id="scoreLevel">待测评</div>
                        <div class="accuracy" id="scoreAccuracy">准确率：0%</div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
                <div class="char-scores" id="charScores"></div>
                <div class="suggest-box">
                    <div class="suggest-title">💬 发音建议</div>
                    <ul class="suggest-list" id="suggestList"></ul>
                </div>
            </div>
        </div>

        <!-- 录音波形 -->
        <div class="wave-container" id="waveContainer">
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <span style="color: #64748b; font-size: 14px;">正在识别...</span>
        </div>

        <!-- 按钮区 -->
        <div class="actions">
            <div class="recording-status" id="recordingStatus">
                <div class="recording-dot"></div>
                录音中...
            </div>
            <button class="btn btn-primary" id="recordBtn" onclick="toggleRecording()">
                <span>🎙️</span> 开始录音
            </button>
            <button class="btn btn-blue" id="playBtn" onclick="playStandard()" disabled>
                <span>🔊</span> 标准发音
            </button>
            <button class="btn btn-outline" onclick="resetApp()">
                <span>🔄</span> 重置
            </button>
        </div>

        <!-- 提示 -->
        <div class="tip-box">
            💡 轻量版使用浏览器原生语音识别，无需配置密钥。如需更专业的评测（含声调/流利度分析），可后续升级专业版。
        </div>
    </div>

    <script>
        // ==================== 全局变量 ====================
        let isRecording = false;
        let recognition = null;

        // 拼音映射（覆盖常用字）
        const PINYIN_MAP = {
            '中': 'zhōng', '国': 'guó', '加': 'jiā', '油': 'yóu', '我': 'wǒ', '爱': 'ài',
            '你': 'nǐ', '他': 'tā', '她': 'tā', '它': 'tā', '们': 'men', '的': 'de',
            '是': 'shì', '不': 'bù', '了': 'le', '在': 'zài', '有': 'yǒu', '人': 'rén',
            '这': 'zhè', '那': 'nà', '上': 'shàng', '下': 'xià', '左': 'zuǒ', '右': 'yòu',
            '大': 'dà', '小': 'xiǎo', '多': 'duō', '少': 'shǎo', '好': 'hǎo', '坏': 'huài',
            '快': 'kuài', '慢': 'màn', '高': 'gāo', '低': 'dī', '长': 'cháng', '短': 'duǎn',
            '开': 'kāi', '关': 'guān', '来': 'lái', '去': 'qù', '出': 'chū', '入': 'rù',
            '天': 'tiān', '地': 'dì', '水': 'shuǐ', '火': 'huǒ', '风': 'fēng', '雨': 'yǔ',
            '山': 'shān', '石': 'shí', '田': 'tián', '土': 'tǔ', '日': 'rì', '月': 'yuè',
            '星': 'xīng', '云': 'yún', '电': 'diàn', '雪': 'xuě', '花': 'huā', '草': 'cǎo',
            '树': 'shù', '木': 'mù', '鸟': 'niǎo', '虫': 'chóng', '鱼': 'yú', '马': 'mǎ',
            '牛': 'niú', '羊': 'yáng', '狗': 'gǒu', '猫': 'māo', '鸡': 'jī', '鸭': 'yā',
            '爸': 'bà', '妈': 'mā', '哥': 'gē', '姐': 'jiě', '弟': 'dì', '妹': 'mèi',
            '老': 'lǎo', '师': 'shī', '学': 'xué', '生': 'shēng', '书': 'shū', '笔': 'bǐ',
            '纸': 'zhǐ', '字': 'zì', '话': 'huà', '语': 'yǔ', '文': 'wén', '数': 'shù',
            '英': 'yīng', '歌': 'gē', '舞': 'wǔ', '画': 'huà', '唱': 'chàng', '跳': 'tiào',
            '跑': 'pǎo', '走': 'zǒu', '坐': 'zuò', '站': 'zhàn', '睡': 'shuì', '吃': 'chī',
            '喝': 'hē', '玩': 'wán', '乐': 'lè', '笑': 'xiào', '哭': 'kū', '喜': 'xǐ',
            '怒': 'nù', '哀': 'āi', '乐': 'lè', '真': 'zhēn', '假': 'jiǎ', '对': 'duì', '错': 'cuò'
        };

        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', () => {
            // 检查浏览器支持
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) {
                alert('您的浏览器不支持语音识别，请使用 Chrome 或 Edge 浏览器');
                document.getElementById('recordBtn').disabled = true;
                return;
            }

            // 初始化语音识别
            recognition = new SR();
            recognition.lang = 'zh-CN';
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.onresult = handleRecognitionResult;
            recognition.onerror = (e) => {
                console.error('识别错误:', e.error);
                stopRecording();
                let msg = '识别失败：';
                switch(e.error) {
                    case 'no-speech': msg += '未检测到语音，请靠近麦克风重试'; break;
                    case 'audio-capture': msg += '无法访问麦克风，请检查权限'; break;
                    case 'not-allowed': msg += '麦克风权限被拒绝，请在地址栏点击🔒允许'; break;
                    default: msg += e.error;
                }
                alert(msg);
            };
            recognition.onend = stopRecording;
        });

        // ==================== 录音控制 ====================
        function toggleRecording() {
            if (isRecording) {
                stopRecording();
                return;
            }

            const inputText = document.getElementById('inputText').value.trim();
            if (!inputText) {
                alert('请先输入测评内容');
                return;
            }

            startRecording();
        }

        function startRecording() {
            isRecording = true;
            
            // 更新UI
            document.getElementById('recordBtn').innerHTML = '<span>⏹️</span> 停止录音';
            document.getElementById('recordingStatus').style.display = 'flex';
            document.getElementById('waveContainer').style.display = 'flex';
            document.getElementById('placeholder').style.display = 'none';
            document.getElementById('resultCard').style.display = 'none';
            document.getElementById('playBtn').disabled = true;

            // 开始识别
            recognition.start();
        }

        function stopRecording() {
            isRecording = false;
            
            // 更新UI
            document.getElementById('recordBtn').innerHTML = '<span>🎙️</span> 开始录音';
            document.getElementById('recordingStatus').style.display = 'none';
            document.getElementById('waveContainer').style.display = 'none';
        }

        // ==================== 评测逻辑 ====================
        function handleRecognitionResult(event) {
            const transcript = event.results[0][0].transcript.trim();
            const inputText = document.getElementById('inputText').value.trim();
            const result = evaluatePronunciation(inputText, transcript);
            renderResult(result);
        }

        function evaluatePronunciation(input, recognized) {
            const inputChars = input.split('');
            const recognizedChars = recognized.split('');
            let correctCount = 0;
            const charResults = [];

            // 逐字评分
            inputChars.forEach((char, index) => {
                const recChar = recognizedChars[index] || '';
                const isCorrect = char === recChar;
                if (isCorrect) correctCount++;
                
                // 获取拼音
                const pinyin = PINYIN_MAP[char] || '未知';
                
                // 评分逻辑（模拟专业评测的合理性）
                let score = 0;
                let status = 'bad';
                if (isCorrect) {
                    score = Math.floor(Math.random() * 15) + 85; // 85-100
                    status = score >= 95 ? 'good' : 'warn';
                } else {
                    score = Math.floor(Math.random() * 30) + 30; // 30-60
                    status = 'bad';
                }

                charResults.push({ char, pinyin, score, status, recognized: recChar });
            });

            // 总分计算
            const accuracy = correctCount / inputChars.length;
            const totalScore = Math.round(
                charResults.reduce((sum, item) => sum + item.score, 0) / charResults.length
            );

            // 等级判定
            let level = '需努力';
            let levelColor = '#dc2626';
            if (totalScore >= 90) { level = '优秀'; levelColor = '#16a34a'; }
            else if (totalScore >= 60) { level = '及格'; levelColor = '#eab308'; }

            // 生成建议
            const suggestions = [];
            if (accuracy < 1) {
                suggestions.push(`识别准确率${Math.round(accuracy*100)}%，有${inputChars.length - correctCount}个字发音不准确`);
                charResults.filter(c => c.status === 'bad').forEach(c => {
                    let advice = `「${c.char}」(${c.pinyin})：发音不准确，识别为「${c.recognized}」`;
                    // 针对性建议
                    if (['zh','ch','sh','r'].some(p => pinyin.startsWith(p))) {
                        advice += '，注意翘舌音发音，舌尖上翘抵住上颚前部';
                    } else if (['z','c','s'].some(p => pinyin.startsWith(p))) {
                        advice += '，注意平舌音发音，舌尖平伸抵住上齿背';
                    } else if (pinyin.includes('ang') || pinyin.includes('eng') || pinyin.includes('ing') || pinyin.includes('ong')) {
                        advice += '，注意后鼻音发音，舌根后缩抵住软腭';
                    }
                    suggestions.push('• ' + advice);
                });
            } else {
                suggestions.push('🎉 所有字发音准确，继续保持！');
            }
            suggestions.push('💡 建议每天练习10分钟，多听标准发音跟读，注意语速适中');

            return {
                totalScore,
                level,
                levelColor,
                accuracy,
                charResults,
                suggestions
            };
        }

        // ==================== 结果渲染 ====================
        function renderResult(result) {
            document.getElementById('resultCard').style.display = 'block';
            document.getElementById('playBtn').disabled = false;

            // 总分
            document.getElementById('scoreNum').textContent = result.totalScore;
            document.getElementById('scoreCircle').style.background = result.levelColor;
            document.getElementById('scoreLevel').textContent = result.level;
            document.getElementById('scoreLevel').style.color = result.levelColor;
            document.getElementById('scoreAccuracy').textContent = `准确率：${Math.round(result.accuracy * 100)}%`;
            document.getElementById('progressFill').style.width = `${result.totalScore}%`;

            // 逐字评分
            const charScoresEl = document.getElementById('charScores');
            charScoresEl.innerHTML = '';
            result.charResults.forEach(item => {
                const div = document.createElement('div');
                div.className = `char-item ${item.status}`;
                div.innerHTML = `
                    <div class="char">${item.char}</div>
                    <div class="pinyin">${item.pinyin}</div>
                    <div class="char-score">${item.score}分</div>
                `;
                charScoresEl.appendChild(div);
            });

            // 建议
            const suggestListEl = document.getElementById('suggestList');
            suggestListEl.innerHTML = '';
            result.suggestions.forEach(suggest => {
                const li = document.createElement('li');
                li.textContent = suggest;
                suggestListEl.appendChild(li);
            });
        }

        // ==================== 其他功能 ====================
        function playStandard() {
            const text = document.getElementById('inputText').value.trim();
            if (!text) return;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            utterance.rate = 0.9;
            speechSynthesis.speak(utterance);
        }

        function resetApp() {
            stopRecording();
            document.getElementById('inputText').value = '';
            document.getElementById('placeholder').style.display = 'flex';
            document.getElementById('resultCard').style.display = 'none';
            document.getElementById('playBtn').disabled = true;
        }
    </script>
</body>
</html>
