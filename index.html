<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>发音评测 | Pronunciation Test</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f6f8fc;min-height:100vh;padding:20px;color:#0f172a}
.app{max-width:860px;margin:0 auto;background:#fff;border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.06);padding:28px 32px 36px}
.title{font-size:22px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.title span{background:#3b82f6;color:#fff;font-size:12px;padding:2px 10px;border-radius:16px}
.subtitle{font-size:13px;color:#64748b;margin-bottom:20px;line-height:1.5}
.tabs{display:flex;gap:8px;margin-bottom:20px}
.tab{padding:8px 20px;border-radius:24px;border:2px solid #e2e8f0;background:transparent;font-size:14px;font-weight:600;color:#475569;cursor:pointer;font-family:inherit}
.tab.active{background:#0f172a;color:#fff;border-color:#0f172a}
.input-hint{font-size:12px;color:#94a3b8;margin:8px 0 16px;line-height:1.6}
textarea{width:100%;min-height:64px;padding:14px 16px;border:2px solid #e2e8f0;border-radius:14px;font-size:16px;resize:vertical;font-family:inherit;transition:.2s}
textarea:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 4px rgba(59,130,246,.08)}
.viz{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.viz-panel{background:#f8fafc;border-radius:14px;padding:12px;border:1px solid #eef2f6}
.viz-title{font-size:12px;font-weight:600;color:#475569;margin-bottom:8px}
canvas{width:100%;height:80px;background:#fff;border-radius:8px;display:block}
.score-card{background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:20px;padding:20px 24px;color:#fff;margin-bottom:20px;display:none}
.score-row{display:flex;justify-content:space-between;align-items:center}
.score-num{font-size:44px;font-weight:700}
.score-level{font-size:16px;font-weight:600;opacity:.9}
.score-acc{font-size:13px;opacity:.85;margin-top:4px}
.cards{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}
.char-card{padding:10px 14px;border-radius:12px;min-width:72px;text-align:center;background:#fff;border:1px solid #e2e8f0}
.char-card.good{border-color:#16a34a;background:#f0fdf4}
.char-card.warn{border-color:#eab308;background:#fefce8}
.char-card.bad{border-color:#dc2626;background:#fef2f2}
.char-han{font-size:20px;font-weight:700}
.char-py{font-size:11px;color:#64748b;margin:2px 0}
.char-tag{font-size:11px;font-weight:600}
.tag-good{color:#16a34a}.tag-warn{color:#eab308}.tag-bad{color:#dc2626}
.advice{background:#f0f9ff;border-radius:16px;padding:16px 20px;border-left:4px solid #0ea5e9;display:none}
.advice-title{font-size:14px;font-weight:600;color:#0369a1;margin-bottom:8px}
.advice-list{font-size:13px;line-height:1.7;color:#0369a1;list-style:none}
.advice-list li{padding:3px 0;border-bottom:1px solid #bae6fd}
.advice-list li:last-child{border:none}
.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{padding:12px 24px;border:none;border-radius:36px;font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit;transition:.2s}
.btn-dark{background:#0f172a;color:#fff}
.btn-dark:hover{background:#1e293b}
.btn-dark.recording{background:#dc2626}
.btn-blue{background:#3b82f6;color:#fff}
.btn-blue:hover{background:#2563eb}
.btn-outline{background:transparent;border:2px solid #e2e8f0;color:#1e293b}
.btn-outline:hover{background:#f8fafc}
.btn:disabled{opacity:.5;cursor:not-allowed}
.status{padding:10px 14px;border-radius:10px;margin-bottom:12px;font-size:13px;display:none}
.status.error{background:#fef2f2;color:#dc2626;border-left:3px solid #dc2626}
.status.info{background:#f0f9ff;color:#0369a1;border-left:3px solid #0ea5e9}
.status.ok{background:#f0fdf4;color:#16a34a;border-left:3px solid #16a34a}
.recognized-text{background:#f8fafc;border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:14px;color:#334155;display:none;border:1px solid #eef2f6}
.recognized-text strong{color:#0f172a}
@media(max-width:640px){.viz{grid-template-columns:1fr}.actions{flex-direction:column}.btn{justify-content:center}}
</style>
</head>
<body>
<div class="app">
  <div class="title">🎙️ 发音评测 <span>New</span></div>
  <div class="subtitle">输入中文，录音后自动分析声调、轻声、儿化 | Type Chinese, record, get instant tone analysis</div>

  <div class="tabs">
    <button class="tab active" id="tabText" onclick="switchTab('text')">📝 文本测评 | Text</button>
    <button class="tab" id="tabFree" onclick="switchTab('free')">🗣️ 自由说 | Free Speak</button>
  </div>

  <div id="textMode">
    <textarea id="inputText" placeholder="输入中文，如：妈妈的花儿 | Type Chinese, e.g. 妈妈的花儿"></textarea>
    <div class="input-hint">
      💡 轻声：后加 <code>(轻)</code>，如 <code>妈妈(轻)</code> ｜ 儿化：直接写"儿"，如 <code>花儿</code>、<code>玩儿</code>
    </div>
  </div>

  <div id="freeMode" style="display:none">
    <div class="input-hint">
      💡 点"开始录音"，自由说话，系统自动识别内容并测评声调、轻声、儿化
    </div>
  </div>

  <div class="status" id="statusMsg"></div>
  <div class="recognized-text" id="recognizedText"></div>

  <div class="viz">
    <div class="viz-panel"><div class="viz-title">🌊 声波 | Waveform</div><canvas id="waveCanvas"></canvas></div>
    <div class="viz-panel"><div class="viz-title">🎵 音高 | Pitch (F0)</div><canvas id="pitchCanvas"></canvas></div>
  </div>

  <div class="score-card" id="scoreCard">
    <div class="score-row">
      <div><div class="score-num" id="totalScore">0</div><div class="score-level" id="scoreLevel">-</div></div>
      <div style="text-align:right"><div style="font-size:12px;opacity:.85">准确率</div><div class="score-acc" id="accuracyRate">0%</div></div>
    </div>
  </div>

  <div class="cards" id="charCards"></div>

  <div class="advice" id="adviceBox">
    <div class="advice-title">💬 纠偏建议 | Suggestions</div>
    <ul class="advice-list" id="adviceList"></ul>
  </div>

  <div class="actions">
    <button class="btn btn-dark" id="recordBtn" onclick="toggleRecording()">🎙️ 开始录音 | Start</button>
    <button class="btn btn-blue" id="playBtn" onclick="playStandard()" disabled>🔊 标准发音 | Play</button>
    <button class="btn btn-outline" onclick="resetAll()">🔄 重置 | Reset</button>
  </div>
</div>

<script>
// ========== 全局 ==========
let mode = 'text';
let isRecording = false;
let audioCtx = null, analyser = null, mic = null, proc = null;
let audioBuf = [], pitchBuf = [];
let waveCanvas, waveCtx, pitchCanvas, pitchCtx;
let calibratedF0 = 150, isCalibrated = false;
let lastRecognitionText = '';

// 儿化字集合（"儿"紧跟前面字时合并为儿化词）
const ERHUA_WORDS = ['花','玩','这','那','哪','一会儿','小孩'];
// 轻声字集合
const NEUTRAL_CHARS = ['们','的','了','吗','呢','吧','啊','嘛','子','头','么','过','着','得','地'];
// 多字词字典（优先匹配）
const WORD_DICT = {
  '妈妈': { py: ['mā','ma(轻)'], tone: [1,0] },
  '桌子': { py: ['zhuō','zi(轻)'], tone: [1,0] },
  '椅子': { py: ['yǐ','zi(轻)'], tone: [3,0] },
  '衣服': { py: ['yī','fu(轻)'], tone: [1,0] },
  '明白': { py: ['míng','bai(轻)'], tone: [2,0] },
  '东西': { py: ['dōng','xi(轻)'], tone: [1,0] },
  '舒服': { py: ['shū','fu(轻)'], tone: [1,0] },
  '花儿': { py: ['huā','ér(儿)'], tone: [1,2] },
  '这儿': { py: ['zhè','ér(儿)'], tone: [4,2] },
  '那儿': { py: ['nà','ér(儿)'], tone: [4,2] },
  '玩儿': { py: ['wán','ér(儿)'], tone: [2,2] },
  '中国': { py: ['zhōng','guó'], tone: [1,2] },
  '加油': { py: ['jiā','yóu'], tone: [1,2] }
};

// 单字拼音+声调
const CHAR_DICT = {
  '妈':'mā|1','麻':'má|2','马':'mǎ|3','骂':'mà|4',
  '花':'huā|1','儿':'ér|2','桌':'zhuō|1','子':'zi|0',
  '我':'wǒ|3','爱':'ài|4','你':'nǐ|3','他':'tā|1',
  '中':'zhōng|1','国':'guó|2','加':'jiā|1','油':'yóu|2',
  '好':'hǎo|3','不':'bù|4','是':'shì|4','大':'dà|4',
  '小':'xiǎo|3','多':'duō|1','少':'shǎo|3','快':'kuài|4',
  '慢':'màn|4','高':'gāo|1','低':'dī|1','长':'cháng|2',
  '短':'duǎn|3','开':'kāi|1','关':'guān|1','来':'lái|2',
  '去':'qù|4','上':'shàng|4','下':'xià|4','左':'zuǒ|3',
  '右':'yòu|4','人':'rén|2','口':'kǒu|3','手':'shǒu|3',
  '足':'zú|2','目':'mù|4','耳':'ěr|3','鼻':'bí|2',
  '天':'tiān|1','地':'dì|4','水':'shuǐ|3','火':'huǒ|3',
  '风':'fēng|1','雨':'yǔ|3','山':'shān|1','石':'shí|2',
  '田':'tián|2','土':'tǔ|3','日':'rì|4','月':'yuè|4',
  '星':'xīng|1','云':'yún|2','电':'diàn|4','雪':'xuě|3'
};

// 标准五度值曲线
const STD_CURVES = {
  1:[5,5,5,5,5], 2:[3,3.5,4,4.5,5], 3:[2,1,2,3,4], 4:[5,4,3,2,1], 0:[2,1.5,1,0.5,0.5]
};

// ========== 初始化 ==========
document.addEventListener('DOMContentLoaded', () => {
  waveCanvas = document.getElementById('waveCanvas');
  pitchCanvas = document.getElementById('pitchCanvas');
  waveCtx = waveCanvas.getContext('2d');
  pitchCtx = pitchCanvas.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  showStatus('info', '就绪 | Ready. 输入中文或切换自由说，点开始录音');
});

function resizeCanvas() {
  [waveCanvas, pitchCanvas].forEach(c => {
    c.width = c.parentElement.clientWidth;
    c.height = 80;
  });
  clearC(waveCtx, waveCanvas);
  clearC(pitchCtx, pitchCanvas);
}

function clearC(ctx, c) { ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); }

function showStatus(type, msg) {
  const el = document.getElementById('statusMsg');
  el.className = 'status ' + type;
  el.innerHTML = msg;
  el.style.display = 'block';
  if (type !== 'error') setTimeout(() => el.style.display='none', 5000);
}

// ========== Tab 切换 ==========
function switchTab(t) {
  mode = t;
  document.getElementById('tabText').classList.toggle('active', t==='text');
  document.getElementById('tabFree').classList.toggle('active', t==='free');
  document.getElementById('textMode').style.display = t==='text' ? 'block' : 'none';
  document.getElementById('freeMode').style.display = t==='free' ? 'block' : 'none';
  resetResultUI();
}

// ========== 输入解析（核心修复：正确处理轻声/儿化） ==========
function parseInput(text) {
  const result = [];
  let i = 0;
  // 去掉空格
  text = text.replace(/\s/g, '');

  while (i < text.length) {
    let matched = false;

    // 1) 先匹配多字词（如 妈妈(轻)、花儿(儿)、中国）
    // 检查 (轻) (儿) 标记
    let annotated = '';
    if (i < text.length - 2) {
      const tail = text.slice(i, i + 3);
      if (tail.endsWith('(轻)')) annotated = tail.slice(0,-3);
      if (tail.endsWith('(儿)')) annotated = tail.slice(0,-3);
    }

    // 尝试多字词 + 可选标注
    for (const word of Object.keys(WORD_DICT)) {
      if (text.startsWith(word, i)) {
        // 检查后面是否紧跟 (轻) 或 (儿)
        let toneOverride = null;
        if (text.startsWith('(轻)', i + word.length)) {
          toneOverride = word.split('').map(c => NEUTRAL_CHARS.includes(c) || c==='们' ? 0 : 0);
          // 全部轻声
          toneOverride = word.split('').map(()=>0);
        }
        const info = WORD_DICT[word];
        const tones = toneOverride || info.tone;
        const pys = info.py;
        word.split('').forEach((ch, idx) => {
          const t = tones[idx] ?? tones[0];
          const py = pys[idx] ?? pys[0];
          result.push({
            char: ch, py,
            tone: t,
            isNeutral: t === 0,
            isErhua: py.includes('(儿)')
          });
        });
        i += word.length;
        if (text.startsWith('(轻)', i)) i += 3;
        if (text.startsWith('(儿)', i)) i += 3;
        matched = true;
        break;
      }
    }
    if (matched) continue;

    // 2) 儿化合并：当前字 + 下一个字是"儿" → 合并为儿化词
    if (i < text.length - 1 && text[i+1] === '儿') {
      const ch = text[i];
      const charInfo = CHAR_DICT[ch] ? CHAR_DICT[ch].split('|') : [ch+'ā','1'];
      const basePy = charInfo[0].replace(/[1-4]/,'');
      result.push({
        char: ch + '儿',
        py: basePy + 'r(儿)',
        tone: 2, // 儿化按二声上升趋势
        isNeutral: false,
        isErhua: true
      });
      i += 2; // 跳过 字+儿
      matched = true;
    }
    if (matched) continue;

    // 3) 单字 + (轻)/(儿) 标注
    if (i < text.length) {
      const ch = text[i];
      // 检查后跟标注
      if (text.startsWith('(轻)', i+1)) {
        result.push({ char: ch, py: ch+'(轻)', tone: 0, isNeutral: true, isErhua: false });
        i += 1 + 3;
        matched = true;
      } else if (text.startsWith('(儿)', i+1)) {
        const charInfo = CHAR_DICT[ch] ? CHAR_DICT[ch].split('|') : [ch+'ā','1'];
        const basePy = charInfo[0].replace(/[1-4]/,'');
        result.push({ char: ch, py: basePy+'r(儿)', tone: 2, isNeutral: false, isErhua: true });
        i += 1 + 3;
        matched = true;
      } else {
        // 纯单字：查字典，或判断是否为轻声字
        const dict = CHAR_DICT[ch];
        if (dict) {
          const [py, tn] = dict.split('|');
          const t = parseInt(tn);
          result.push({ char: ch, py, tone: t, isNeutral: t===0, isErhua: false });
        } else {
          // 未知字：启发式判断轻声
          const isNeu = NEUTRAL_CHARS.includes(ch);
          result.push({ char: ch, py: ch+(isNeu?'轻':'?'), tone: isNeu?0:1, isNeutral: isNeu, isErhua: false });
        }
        i += 1;
        matched = true;
      }
    }
  }
  return result;
}

// ========== 录音控制 ==========
async function toggleRecording() {
  if (isRecording) { stopRecording(); return; }

  if (mode === 'text') {
    const t = document.getElementById('inputText').value.trim();
    if (!t) return showStatus('error', '请先输入中文 | Please type Chinese first');
  }

  try { await startRecording(); }
  catch(e) { console.error(e); showStatus('error','录音失败 | Failed: '+e.message); stopRecording(); }
}

async function startRecording() {
  isRecording = true;
  audioBuf = []; pitchBuf = [];
  const btn = document.getElementById('recordBtn');
  btn.classList.add('recording');
  btn.innerHTML = '⏹️ 停止 | Stop';
  clearC(waveCtx, waveCanvas); clearC(pitchCtx, pitchCanvas);
  resetResultUI();

  const stream = await navigator.mediaDevices.getUserMedia({
    audio:{sampleRate:16000,channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:false}
  });
  audioCtx = new (window.AudioContext||window.webkitAudioContext)({sampleRate:16000});
  analyser = audioCtx.createAnalyser();
  mic = audioCtx.createMediaStreamSource(stream);
  proc = audioCtx.createScriptProcessor(4096,1,1);
  mic.connect(analyser); analyser.connect(proc); proc.connect(audioCtx.destination);
  analyser.fftSize = 2048;
  const td = new Float32Array(4096);

  proc.onaudioprocess = e => {
    analyser.getFloatTimeDomainData(td);
    audioBuf.push(...Array.from(td));
    drawWave(td);
    const f0 = estF0(td, 16000);
    if (f0>50 && f0<500) { pitchBuf.push(f0); drawPitch(f0); }
  };
  showStatus('ok','录音中… | Recording… 清晰朗读');
}

function stopRecording() {
  isRecording = false;
  const btn = document.getElementById('recordBtn');
  btn.classList.remove('recording');
  btn.innerHTML = '🎙️ 开始录音 | Start';
  try { proc && proc.disconnect(); mic && mic.disconnect(); analyser && analyser.disconnect(); audioCtx && audioCtx.close(); } catch(e){}
  proc=null; mic=null; analyser=null; audioCtx=null;

  if (audioBuf.length < 1600) {
    return showStatus('error','录音太短 | Too short, please try again');
  }

  // 自由说模式：先语音识别，再测评
  if (mode === 'free') {
    runSpeechRecognition();
  } else {
    // 文本模式：直接测评
    const text = document.getElementById('inputText').value.trim();
    runEvaluation(text);
  }
}

// ========== 语音识别（自由说模式） ==========
function runSpeechRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    return showStatus('error','当前浏览器不支持语音识别，请使用 Chrome/Edge | Browser not supported, use Chrome/Edge');
  }
  const rec = new SR();
  rec.lang = 'zh-CN';
  rec.continuous = false;
  rec.interimResults = false;

  showStatus('info','正在识别你说的内容… | Recognizing speech…');

  rec.onresult = e => {
    const text = e.results[0][0].transcript.trim();
    lastRecognitionText = text;
    document.getElementById('recognizedText').style.display = 'block';
    document.getElementById('recognizedText').innerHTML =
      '识别结果 | Recognized: <strong>' + text + '</strong>';
    // ★ 关键：识别完自动进入测评
    runEvaluation(text);
  };
  rec.onerror = e => {
    showStatus('error','识别失败 | Recognition failed: '+e.error);
  };
  rec.onend = () => {};
  rec.start();
}

// ========== 核心测评引擎 ==========
function runEvaluation(text) {
  if (!text) return showStatus('error','无输入内容 | No input text');
  const parsed = parseInput(text);
  if (parsed.length === 0) return showStatus('error','解析失败，请检查输入 | Parse failed');

  // 智能切片
  const segments = splitBySilence(audioBuf, 16000);
  const perSeg = Math.floor(audioBuf.length / parsed.length);

  const toneResults = parsed.map((item, idx) => {
    // 取对应时间段的音频
    let segBuf;
    if (segments.length === parsed.length) {
      segBuf = segments[idx] || [];
    } else {
      const start = idx * perSeg;
      const end = Math.min((idx+1)*perSeg, audioBuf.length);
      segBuf = audioBuf.slice(start, end);
    }
    // 计算该段的基频序列
    const f0List = [];
    for (let i=0; i<segBuf.length; i+=2048) {
      const chunk = segBuf.slice(i, i+2048);
      if (chunk.length < 1024) break;
      const f0 = estF0(new Float32Array(chunk), 16000);
      if (f0>50 && f0<500) f0List.push(f0);
    }
    // 平滑：去首尾20%异常
    let avgF0 = 0;
    if (f0List.length > 0) {
      const sorted = [...f0List].sort((a,b)=>a-b);
      const trim = sorted.slice(Math.floor(sorted.length*.15), Math.ceil(sorted.length*.85));
      avgF0 = trim.reduce((a,b)=>a+b,0) / (trim.length || 1);
    }
    const userFive = normF0(avgF0);
    const stdFive = STD_CURVES[item.tone] ? STD_CURVES[item.tone][2] : 3;
    const dev = userFive - stdFive;

    return { ...item, avgF0, userFive, stdFive, deviation: dev };
  });

  renderReport(toneResults, text);
}

// ========== 渲染报告 ==========
function renderReport(results, text) {
  // 分数
  let total = 0, errCount = 0;
  results.forEach(r => {
    const ad = Math.abs(r.deviation);
    let s = 100;
    if (ad > 0.3) s = Math.max(0, 100 - ad*18);
    if (r.isNeutral && ad > 0.5) s = Math.max(0, 100 - ad*25);
    total += s;
    if (ad > 0.5) errCount++;
  });
  const avg = Math.round(total / results.length);
  let level = '需努力', lvlColor = '#dc2626';
  if (avg>=90){level='优秀';lvlColor='#16a34a';}
  else if(avg>=75){level='良好';lvlColor='#3b82f6';}
  else if(avg>=60){level='及格';lvlColor='#eab308';}

  // 评分卡
  const sc = document.getElementById('scoreCard');
  sc.style.display='block';
  sc.style.background = `linear-gradient(135deg, ${lvlColor}, #6366f1)`;
  document.getElementById('totalScore').textContent = avg;
  document.getElementById('scoreLevel').textContent = level;
  document.getElementById('accuracyRate').textContent =
    Math.round((results.length-errCount)/results.length*100)+'%';

  // 逐字卡片
  const cards = document.getElementById('charCards');
  cards.innerHTML = '';
  results.forEach(r => {
    const ad = Math.abs(r.deviation);
    let status = 'good', tag = '✓ 准确', tagClass='tag-good';
    if (ad > 1) { status='bad'; tag='✗ ±'+r.deviation.toFixed(1); tagClass='tag-bad'; }
    else if (ad > 0.3) { status='warn'; tag='~ ±'+r.deviation.toFixed(1); tagClass='tag-warn'; }
    else { tag = '✓'; }

    const div = document.createElement('div');
    div.className = 'char-card '+status;
    div.innerHTML = `
      <div class="char-han">${r.char}</div>
      <div class="char-py">${r.py}</div>
      <div class="char-tag ${tagClass}">${tag}</div>
    `;
    cards.appendChild(div);
  });

  // 建议
  const advBox = document.getElementById('adviceBox');
  advBox.style.display='block';
  const ul = document.getElementById('adviceList');
  ul.innerHTML='';
  const advMap = {
    1:{hi:'一声偏高：保持平稳高音，声带紧绷不要下滑 | 1st too high: keep level, don\'t fall',
       lo:'一声偏低：提高声带张力，维持在高位 | 1st too low: raise tension, stay high'},
    2:{hi:'二声升幅过大：从中音缓慢上扬，不要跳跃 | 2nd overshoot: rise slowly from mid',
       lo:'二声升幅不足：明显从中音升到高音 | 2nd undershoot: rise clearly to high'},
    3:{hi:'三声最低点太高：先降到最低再回升 | 3rd dip too shallow: drop to bottom first',
       lo:'三声不到位：先降后升要明显 | 3rd incomplete: clear dip-rise'},
    4:{hi:'四声降太慢：快速从高到低 | 4th too slow: drop fast',
       lo:'四声降不够：从高音快速落到底 | 4th insufficient: drop sharply to bottom'},
    0:{hi:'轻声偏重：放松声带，短而轻，约前字一半时长 | Neutral too heavy: relax, short & light',
       lo:'轻声偏短：保留一点长度但轻读 | Neutral too short: keep some length but light'}
  };
  results.forEach(r => {
    const ad = r.deviation;
    if (Math.abs(ad) > 0.5) {
      const m = advMap[r.tone];
      if (m) {
        const li = document.createElement('li');
        li.innerHTML = `<strong>${r.char}(${r.py})</strong>: ${ad>0?m.hi:m.lo}`;
        ul.appendChild(li);
      }
    }
    if (r.isErhua && Math.abs(ad)>0.5) {
      const li = document.createElement('li');
      li.innerHTML = `<strong>${r.char}(${r.py})</strong>: 儿化舌尖上卷至硬腭中部 | Erhua: curl tongue tip to hard palate`;
      ul.appendChild(li);
    }
  });
  if (ul.children.length===0) {
    const li=document.createElement('li');
    li.textContent='🎉 所有发音准确！| All tones accurate!';
    ul.appendChild(li);
  }

  document.getElementById('playBtn').disabled = false;
  showStatus('ok','评测完成 | Evaluation complete');
}

// ========== 基频估计（自相关） ==========
function estF0(buf, sr) {
  const rms = Math.sqrt(buf.reduce((s,v)=>s+v*v,0)/buf.length);
  if (rms < 0.015) return 0;
  let maxC=0, bestP=0;
  const mn=Math.floor(sr/500), mx=Math.floor(sr/50);
  for (let p=mn; p<mx; p++) {
    let c=0;
    for (let i=0; i<buf.length-p; i++) c += buf[i]*buf[i+p];
    c/=(buf.length-p);
    if (c>maxC){maxC=c;bestP=p;}
  }
  return bestP? sr/bestP : 0;
}

// ========== 音高归一化 ==========
function normF0(f0) {
  if (f0<=0) return 3;
  const ratio = f0 / calibratedF0;
  const five = 3 + Math.log2(ratio)*5;
  return Math.max(1, Math.min(5, five));
}

// ========== 静音切片 ==========
function splitBySilence(buf, sr) {
  const frame = Math.floor(sr*0.02), thr=0.015;
  const segs=[], tmp=[];
  let silent=true;
  for (let i=0;i<buf.length;i+=frame) {
    const f=buf.slice(i,i+frame);
    const rms=Math.sqrt(f.reduce((s,v)=>s+v*v,0)/(f.length||1));
    if (rms>thr) { if(silent){tmp=[];silent=false;} tmp.push(...f); }
    else { if(!silent && tmp.length>0){segs.push(tmp);tmp=[];silent=true;} }
  }
  if (tmp.length>0) segs.push(tmp);
  return segs;
}

// ========== 波形/音高绘制 ==========
function drawWave(data) {
  const c=waveCanvas, ctx=waveCtx, w=c.width, h=c.height;
  ctx.drawImage(c,2,0,w-2,h,0,0,w-2,h);
  ctx.fillStyle='#fff'; ctx.fillRect(w-2,0,2,h);
  ctx.strokeStyle='#3b82f6'; ctx.lineWidth=1.5; ctx.beginPath();
  const sw=(w-2)/data.length; let x=w-2;
  for(let i=0;i<data.length;i++){const y=(0.5+data[i]*0.5)*h; i?ctx.lineTo(x,y):ctx.moveTo(x,y); x+=sw;}
  ctx.stroke();
}
function drawPitch(f0) {
  const c=pitchCanvas, ctx=pitchCtx, w=c.width, h=c.height;
  ctx.drawImage(c,2,0,w-2,h,0,0,w-2,h);
  ctx.fillStyle='#fff'; ctx.fillRect(w-2,0,2,h);
  const five=normF0(f0), y=h-(five/5)*h;
  ctx.fillStyle='#8b5cf6'; ctx.beginPath(); ctx.arc(w-1,y,2.5,0,Math.PI*2); ctx.fill();
}

// ========== 其他 ==========
function playStandard() {
  const text = mode==='free' ? lastRecognitionText : document.getElementById('inputText').value.trim();
  if (!text) return;
  const u=new SpeechSynthesisUtterance(text);
  u.lang='zh-CN'; u.rate=0.85;
  speechSynthesis.speak(u);
}

function resetResultUI() {
  document.getElementById('scoreCard').style.display='none';
  document.getElementById('charCards').innerHTML='';
  document.getElementById('adviceBox').style.display='none';
  document.getElementById('recognizedText').style.display='none';
}

function resetAll() {
  if (isRecording) stopRecording();
  document.getElementById('inputText').value='';
  lastRecognitionText='';
  audioBuf=[]; pitchBuf=[];
  clearC(waveCtx,waveCanvas); clearC(pitchCtx,pitchCanvas);
  resetResultUI();
  showStatus('info','已重置 | Reset');
}
