<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>中文发音评测 · 腾讯云智聆口语评测</title>
    <!-- 引入 CryptoJS 用于 HMAC-SHA1 签名 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #e8f0fe 0%, #f5f7ff 50%, #fff5f5 100%);
            color: #1e293b; min-height:100vh;
            display:flex; justify-content:center; align-items:center; padding:20px;
        }
        .app {
            max-width:880px; width:100%; background:#fff; border-radius:28px;
            box-shadow:0 20px 60px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.04);
            overflow:hidden; padding:28px 32px 36px;
        }
        /* 顶部 */
        .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px; }
        .title { font-size:22px; font-weight:700; display:flex; align-items:center; gap:8px; color:#0f172a; }
        .title span.badge { background:#3b82f6; color:#fff; font-size:12px; font-weight:500; padding:2px 12px; border-radius:20px; line-height:22px; }
        .config-btn { background:#f1f5f9; border:1px solid #e2e8f0; border-radius:10px; padding:6px 14px; font-size:13px; cursor:pointer; color:#475569; }
        .config-btn:hover { background:#e2e8f0; }

        /* 配置面板 */
        .config-panel { display:none; background:#f8fafc; border:1px solid #e2e8f0; border-radius:16px; padding:18px 20px; margin-bottom:20px; }
        .config-panel.open { display:block; }
        .config-panel h3 { font-size:15px; margin-bottom:12px; color:#334155; }
        .config-row { display:flex; gap:12px; flex-wrap:wrap; }
        .config-row label { font-size:13px; font-weight:600; color:#475569; min-width:80px; line-height:34px; }
        .config-row input { flex:1; min-width:200px; padding:8px 14px; border:1.5px solid #e2e8f0; border-radius:10px; font-size:14px; font-family:inherit; }
        .config-row input:focus { outline:none; border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.1); }
        .config-tip { font-size:12px; color:#94a3b8; margin-top:8px; line-height:1.6; }
        .config-tip a { color:#3b82f6; text-decoration:none; }
        .config-tip a:hover { text-decoration:underline; }

        /* 选项卡 */
        .tabs { display:flex; gap:6px; background:#f1f5f9; border-radius:14px; padding:4px; margin-bottom:20px; flex-wrap:wrap; }
        .tab-btn { flex:1; min-width:60px; padding:9px 0; border:none; background:transparent; border-radius:10px; font-size:14px; font-weight:600; color:#64748b; cursor:pointer; transition:.2s; }
        .tab-btn:hover { color:#1e293b; }
        .tab-btn.active { background:#fff; color:#0f172a; box-shadow:0 2px 8px rgba(0,0,0,.05); }

        /* 输入区 */
        .input-label { display:flex; justify-content:space-between; align-items:center; font-size:14px; font-weight:600; color:#334155; margin-bottom:6px; }
        .input-label .hint { font-weight:400; color:#94a3b8; font-size:13px; }
        textarea { width:100%; min-height:72px; padding:14px 16px; border:2px solid #e2e8f0; border-radius:14px; font-size:16px; font-family:inherit; resize:vertical; transition:.2s; background:#fafcff; color:#0f172a; line-height:1.6; }
        textarea:focus { outline:none; border-color:#3b82f6; background:#fff; box-shadow:0 0 0 4px rgba(59,130,246,.08); }
        textarea::placeholder { color:#b9c7da; }

        /* 标记行 */
        .marker-row { display:flex; flex-wrap:wrap; gap:12px; margin-top:12px; background:#f8fafc; padding:14px 18px; border-radius:14px; border:1px solid #eef2f6; }
        .marker-group { display:flex; align-items:center; gap:8px; flex:1 1 200px; }
        .marker-group label { font-size:13px; font-weight:600; color:#475569; white-space:nowrap; }
        .marker-group input { flex:1; min-width:80px; padding:6px 12px; border:1.5px solid #e2e8f0; border-radius:18px; font-size:13px; background:#fff; font-family:inherit; }
        .marker-group input:focus { outline:none; border-color:#3b82f6; }

        /* 结果区 */
        .result-area { margin-top:16px; min-height:100px; }
        .placeholder { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:36px 20px; background:#f8fafc; border-radius:18px; border:2px dashed #e2e8f0; color:#94a3b8; text-align:center; }
        .placeholder .icon { font-size:40px; margin-bottom:10px; opacity:.5; }
        .placeholder p { font-size:14px; max-width:340px; line-height:1.7; }

        .result-card { background:#f8fafc; border-radius:18px; padding:20px 24px; border:1px solid #eef2f6; animation:fadeUp .35s ease; }
        @keyframes fadeUp { 0%{opacity:0;transform:translateY(12px)} 100%{opacity:1;transform:translateY(0)} }

        .score-row { display:flex; align-items:center; gap:20px; flex-wrap:wrap; margin-bottom:14px; }
        .score-circle { width:88px; height:88px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:700; font-size:30px; color:#fff; flex-shrink:0; box-shadow:0 4px 14px rgba(0,0,0,.08); }
        .score-circle .label { font-size:11px; font-weight:500; opacity:.85; margin-top:2px; }
        .score-detail { flex:1; min-width:140px; }
        .score-detail .level { font-size:18px; font-weight:700; margin-bottom:2px; }
        .score-detail .sub { font-size:14px; color:#64748b; }
        .progress-bar { width:100%; height:6px; background:#e2e8f0; border-radius:10px; margin:10px 0 14px; overflow:hidden; }
        .progress-bar .fill { height:100%; border-radius:10px; background:linear-gradient(90deg,#3b82f6,#8b5cf6); transition:width .6s ease; width:0%; }

        .detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px 20px; }
        .detail-item { display:flex; align-items:baseline; gap:6px; font-size:14px; }
        .detail-item .tag { font-weight:600; color:#475569; min-width:70px; }
        .detail-item .val { color:#0f172a; }
        .detail-item .val.good { color:#16a34a; }
        .detail-item .val.warn { color:#eab308; }
        .detail-item .val.danger { color:#dc2626; }

        /* 逐字结果 */
        .word-results { margin-top:16px; }
        .word-results h4 { font-size:14px; font-weight:600; color:#334155; margin-bottom:8px; }
        .word-grid { display:flex; flex-wrap:wrap; gap:8px; }
        .word-chip { display:inline-flex; flex-direction:column; align-items:center; padding:8px 14px; border-radius:12px; background:#fff; border:1.5px solid #e2e8f0; min-width:60px; }
        .word-chip .char { font-size:20px; font-weight:700; }
        .word-chip .score { font-size:12px; font-weight:600; margin-top:2px; }
        .word-chip .pinyin { font-size:11px; color:#94a3b8; }
        .word-chip.excellent { border-color:#16a34a; background:#f0fdf4; }
        .word-chip.good { border-color:#84cc16; background:#f7fee7; }
        .word-chip.fair { border-color:#eab308; background:#fefce8; }
        .word-chip.poor { border-color:#dc2626; background:#fef2f2; }

        /* 建议 */
        .suggest-box { margin-top:16px; padding:14px 18px; background:#f1f5f9; border-radius:14px; border-left:4px solid #3b82f6; }
        .suggest-box .title { font-weight:600; font-size:14px; color:#1e293b; margin-bottom:6px; }
        .suggest-list { list-style:none; padding:0; margin:0; font-size:14px; line-height:1.8; color:#334155; }
        .suggest-list li { padding:3px 0; border-bottom:1px solid #e2e8f0; }
        .suggest-list li:last-child { border-bottom:none; }
        .suggest-list .advice { color:#2563eb; font-weight:500; }

        /* 实时波形 */
        .wave-container { margin-top:14px; background:#0f172a; border-radius:14px; padding:12px; }
        .wave-container canvas { width:100%; height:60px; display:block; }
        .wave-label { font-size:12px; color:#64748b; text-align:center; margin-top:4px; }

        /* 按钮 */
        .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; align-items:center; }
        .btn { padding:11px 24px; border:none; border-radius:36px; font-weight:600; font-size:14px; cursor:pointer; transition:.2s; display:inline-flex; align-items:center; gap:6px; justify-content:center; font-family:inherit; }
        .btn:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 4px 12px rgba(0,0,0,.06); }
        .btn:active:not(:disabled) { transform:translateY(0); }
        .btn:disabled { opacity:.45; cursor:not-allowed; }
        .btn-primary { background:#0f172a; color:#fff; }
        .btn-primary:hover:not(:disabled) { background:#1e293b; }
        .btn-blue { background:#3b82f6; color:#fff; }
        .btn-blue:hover:not(:disabled) { background:#2563eb; }
        .btn-outline { background:transparent; border:2px solid #e2e8f0; color:#1e293b; }
        .btn-outline:hover:not(:disabled) { background:#f8fafc; border-color:#cbd5e1; }
        .btn-success { background:#16a34a; color:#fff; }
        .btn-success:hover:not(:disabled) { background:#15803d; }
        .btn:disabled .spinner { display:inline-block; }

        /* 录音状态 */
        .recording-status { display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:500; color:#dc2626; padding:5px 14px; border-radius:30px; background:#fef2f2; border:1px solid #fecaca; }
        .recording-status .dot { width:10px; height:10px; border-radius:50%; background:#dc2626; animation:pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.8)} }

        /* 日志 */
        .log-area { margin-top:14px; background:#1e293b; border-radius:12px; padding:12px 16px; max-height:120px; overflow-y:auto; font-family:'Courier New',monospace; font-size:12px; color:#94a3b8; line-height:1.7; }
        .log-area .log-info { color:#60a5fa; }
        .log-area .log-success { color:#4ade80; }
        .log-area .log-error { color:#f87171; }
        .log-area .log-warn { color:#fbbf24; }

        /* 模态框 */
        .modal-overlay { position:fixed; inset:0; background:rgba(15,23,42,.5); backdrop-filter:blur(6px); display:none; justify-content:center; align-items:center; z-index:999; padding:24px; }
        .modal-overlay.open { display:flex; }
        .modal { background:#fff; max-width:600px; width:100%; max-height:90vh; border-radius:24px; padding:28px 32px 24px; box-shadow:0 40px 80px rgba(0,0,0,.2); overflow-y:auto; animation:fadeUp .3s ease; }
        .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
        .modal-header h2 { font-size:20px; font-weight:700; }
        .modal-close { background:none; border:none; font-size:26px; color:#94a3b8; cursor:pointer; }
        .modal-close:hover { color:#1e293b; }
        .report-content { font-size:14px; line-height:1.8; color:#1e293b; }
        .report-score { font-size:48px; font-weight:700; text-align:center; padding:10px 0 4px; }
        .report-level { text-align:center; font-size:17px; font-weight:600; margin-bottom:14px; }
        .report-section { background:#f8fafc; border-radius:14px; padding:14px 18px; margin:10px 0; }
        .report-section h3 { font-size:14px; font-weight:600; margin-bottom:6px; color:#334155; }
        .report-actions { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }

        /* 响应式 */
        @media(max-width:640px) {
            .app { padding:18px 16px 24px; border-radius:20px; }
            .title { font-size:18px; }
            .tab-btn { font-size:13px; padding:8px 0; }
            .score-circle { width:72px; height:72px; font-size:24px; }
            .detail-grid { grid-template-columns:1fr; gap:6px; }
            .actions { flex-direction:column; align-items:stretch; }
            .btn { justify-content:center; }
            .modal { padding:22px 16px 18px; }
        }

        .hidden { display:none !important; }
    </style>
</head>
<body>

<div class="app" id="app">

    <!-- 顶部 -->
    <header class="header">
        <div class="title">🎙️ 发音评测 <span class="badge">腾讯云智聆</span></div>
        <button class="config-btn" id="toggleConfig">⚙️ 配置密钥</button>
    </header>

    <!-- 配置面板 -->
    <div class="config-panel" id="configPanel">
        <h3>🔑 腾讯云密钥配置</h3>
        <div class="config-row" style="margin-bottom:10px;">
            <label>AppID</label>
            <input type="text" id="cfgAppId" placeholder="如：1306xxxxxx" />
        </div>
        <div class="config-row" style="margin-bottom:10px;">
            <label>SecretId</label>
            <input type="text" id="cfgSecretId" placeholder="AKIDxxxxxxxxxxxxxxxx" />
        </div>
        <div class="config-row">
            <label>SecretKey</label>
            <input type="text" id="cfgSecretKey" placeholder="xxxxxxxxxxxxxxxxxxxx" />
        </div>
        <p class="config-tip">
            💡 密钥获取：登录 <a href="https://console.cloud.tencent.com/capi" target="_blank">腾讯云控制台 → 访问密钥</a>，
            开通 <a href="https://console.cloud.tencent.com/soe" target="_blank">智聆口语评测</a> 服务。
            仅用于开发调试，生产环境请使用临时密钥。
        </p>
        <p class="config-tip" style="margin-top:6px;">
            📖 <a href="https://cloud.tencent.com/document/product/1774/107497" target="_blank">API 文档</a>
            · <a href="https://cloud.tencent.com/document/product/884/78766" target="_blank">快速入门</a>
        </p>
    </div>

    <!-- 选项卡 -->
    <div class="tabs" id="tabs">
        <button class="tab-btn active" data-mode="0">单字 (Word)</button>
        <button class="tab-btn" data-mode="1">句子 (Sentence)</button>
        <button class="tab-btn" data-mode="2">段落 (Passage)</button>
        <button class="tab-btn" data-mode="3">自由说 (Free)</button>
    </div>

    <!-- 输入区 -->
    <div class="input-section">
        <div class="input-label">
            <span>📝 输入测评内容</span>
            <span class="hint" id="modeHint">输入一个汉字，录音后评测发音</span>
        </div>
        <textarea id="inputText" placeholder="例如：中"></textarea>
    </div>

    <!-- 特殊标记 -->
    <div class="marker-row">
        <div class="marker-group">
            <label>🔇 轻声词</label>
            <input type="text" id="lightMarker" placeholder="逗号分隔，如：朋友,了" />
        </div>
        <div class="marker-group">
            <label>🔊 儿化音</label>
            <input type="text" id="erhuaMarker" placeholder="逗号分隔，如：这儿,那儿" />
        </div>
    </div>

    <!-- 实时波形 -->
    <div class="wave-container hidden" id="waveContainer">
        <canvas id="waveCanvas"></canvas>
        <div class="wave-label">🎙️ 实时音量监听中...</div>
    </div>

    <!-- 日志 -->
    <div class="log-area hidden" id="logArea"></div>

    <!-- 结果 -->
    <div class="result-area" id="resultArea">
        <div class="placeholder" id="placeholder">
            <div class="icon">🎤</div>
            <p>配置密钥 → 输入文本 → 点击「开始录音」<br/>系统将录制你的发音并调用腾讯云智聆评测</p>
        </div>
        <div class="result-card hidden" id="resultCard"></div>
    </div>

    <!-- 按钮 -->
    <div class="actions">
        <button class="btn btn-primary" id="btnRecord">
            <span class="icon">🎙️</span> 开始录音
        </button>
        <button class="btn btn-outline" id="btnPlay" disabled>
            <span class="icon">🔊</span> 标准发音
        </button>
        <button class="btn btn-outline" id="btnReset">
            <span class="icon">🔄</span> 重置
        </button>
        <div style="flex:1;min-width:40px;"></div>
        <button class="btn btn-success" id="btnReport" disabled>
            📄 生成报告
        </button>
        <div id="statusBadge" class="hidden recording-status">
            <span class="dot"></span> 录音中...
        </div>
    </div>

</div>

<!-- 报告模态框 -->
<div class="modal-overlay" id="reportModal">
    <div class="modal">
        <div class="modal-header">
            <h2>📋 发音评测报告</h2>
            <button class="modal-close" id="modalClose">✕</button>
        </div>
        <div class="report-content" id="reportContent"></div>
        <div class="report-actions">
            <button class="btn btn-blue" id="printReport">🖨️ 打印 / 保存PDF</button>
            <button class="btn btn-outline" id="closeReport">关闭</button>
        </div>
    </div>
</div>

<script>
'use strict';

// ============================================================
//  全局状态
// ============================================================
let currentMode = '0';       // 0=单字 1=句子 2=段落 3=自由说
let isRecording = false;
let ws = null;                // WebSocket 连接
let audioContext = null;
let mediaStream = null;
let scriptProcessor = null;
let sourceNode = null;
let lastResult = null;
let audioBufferQueue = [];    // 音频数据缓冲队列
let isSending = false;
let voiceId = '';
let startTime = 0;
let animationFrameId = null;

// 评测结果解析
let evalResult = {
    totalScore: 0,
    pronunciationScore: 0,
    fluencyScore: 0,
    completenessScore: 0,
    words: [],       // 逐字结果
    rawResult: ''
};

// ============================================================
//  DOM 引用
// ============================================================
const $ = id => document.getElementById(id);
const inputText = $('inputText');
const lightMarker = $('lightMarker');
const erhuaMarker = $('erhuaMarker');
const placeholder = $('placeholder');
const resultCard = $('resultCard');
const btnRecord = $('btnRecord');
const btnPlay = $('btnPlay');
const btnReset = $('btnReset');
const btnReport = $('btnReport');
const statusBadge = $('statusBadge');
const modeHint = $('modeHint');
const configPanel = $('configPanel');
const waveContainer = $('waveContainer');
const waveCanvas = $('waveCanvas');
const logArea = $('logArea');
const reportModal = $('reportModal');

// ============================================================
//  工具函数
// ============================================================
function log(msg, type = 'info') {
    const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
    const prefix = { info: '🔵', success: '🟢', error: '🔴', warn: '🟡' }[type] || '🔵';
    const cls = { info: 'log-info', success: 'log-success', error: 'log-error', warn: 'log-warn' }[type] || 'log-info';
    const line = document.createElement('div');
    line.className = cls;
    line.textContent = `[${time}] ${prefix} ${msg}`;
    logArea.appendChild(line);
    logArea.scrollTop = logArea.scrollHeight;
    console.log(`[${type}] ${msg}`);
}

function generateUUID() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
}

function urlEncode(str) {
    return encodeURIComponent(str)
        .replace(/!/g, '%21')
        .replace(/'/g, '%27')
        .replace(/\(/g, '%28')
        .replace(/\)/g, '%29')
        .replace(/\*/g, '%2A')
        .replace(/\+/g, '%2B')
        .replace(/%20/g, '+');
}

// HMAC-SHA1 签名
function signRequest(params, secretKey) {
    // 1. 按字典序排序参数
    const sortedKeys = Object.keys(params).sort();
    let queryString = '';
    for (const key of sortedKeys) {
        if (key === 'signature') continue;
        queryString += `${key}=${params[key]}&`;
    }
    queryString = queryString.slice(0, -1); // 去掉末尾 &

    // 2. 拼接签名原文
    const appId = $('cfgAppId').value.trim();
    const signSource = `soe.cloud.tencent.com/soe/api/${appId}?${queryString}`;
    log(`签名原文: ${signSource.substring(0, 80)}...`, 'info');

    // 3. HMAC-SHA1 + Base64
    const hmac = CryptoJS.HmacSHA1(signSource, secretKey);
    const signature = CryptoJS.enc.Base64.stringify(hmac);
    log(`签名结果: ${signature.substring(0, 20)}...`, 'info');

    return signature;
}

// ============================================================
//  构建 WebSocket URL
// ============================================================
function buildWsUrl() {
    const appId = $('cfgAppId').value.trim();
    const secretId = $('cfgSecretId').value.trim();
    const secretKey = $('cfgSecretKey').value.trim();

    if (!appId || !secretId || !secretKey) {
        throw new Error('请先配置 AppID、SecretId 和 SecretKey');
    }

    const now = Math.floor(Date.now() / 1000);
    const expired = now + 3600; // 1小时后过期
    const nonce = Math.floor(Math.random() * 1000000000);
    voiceId = generateUUID();

    const params = {
        secretid: secretId,
        timestamp: now,
        expired: expired,
        nonce: nonce,
        server_engine_type: '16k_zh',
        voice_id: voiceId,
        voice_format: 0,          // 0=pcm
        eval_mode: parseInt(currentMode),
        score_coeff: 1.0,
        sentence_info_enabled: 1,  // 实时返回中间结果
        rec_mode: 0,                // 0=实时
        text_mode: 0,               // 0=普通文本
        signature: ''               // 先空，后面填
    };

    const refText = inputText.value.trim();
    if (refText && currentMode !== '3') {
        params.ref_text = refText;
    }

    // 生成签名
    const signature = signRequest(params, secretKey);
    params.signature = signature;

    // 拼接 URL（所有参数 urlencode）
    let queryString = '';
    for (const key of Object.keys(params).sort()) {
        queryString += `${urlEncode(key)}=${urlEncode(String(params[key]))}&`;
    }
    queryString = queryString.slice(0, -1);

    const url = `wss://soe.cloud.tencent.com/soe/api/${appId}?${queryString}`;
    log(`WebSocket URL 构建完成 (长度: ${url.length})`, 'success');
    return url;
}

// ============================================================
//  解析评测结果
// ============================================================
function parseResult(resultStr) {
    // 结果格式示例:
    // SuggestedScore:-0.36 PronAccuracy:91.2 PronFluency:0.97 PronCompletion:0.2
    // Words:[{Mbtm:760 Metm:230 PronAccuracy:91.2 ... Word:窗 Tag:0 ...}]
    const result = {
        suggestedScore: 0,
        pronAccuracy: 0,
        pronFluency: 0,
        pronCompletion: 0,
        words: []
    };

    try {
        // 提取 SuggestedScore
        const ssMatch = resultStr.match(/SuggestedScore:([-\d.]+)/);
        if (ssMatch) result.suggestedScore = parseFloat(ssMatch[1]);

        // 提取 PronAccuracy
        const paMatch = resultStr.match(/PronAccuracy:([-\d.]+)/);
        if (paMatch) result.pronAccuracy = parseFloat(paMatch[1]);

        // 提取 PronFluency
        const pfMatch = resultStr.match(/PronFluency:([-\d.]+)/);
        if (pfMatch) result.pronFluency = parseFloat(pfMatch[1]);

        // 提取 PronCompletion
        const pcMatch = resultStr.match(/PronCompletion:([-\d.]+)/);
        if (pcMatch) result.pronCompletion = parseFloat(pcMatch[1]);

        // 提取 Words
        const wordsMatch = resultStr.match(/Words:\[(.+?)\]/);
        if (wordsMatch) {
            const wordsStr = wordsMatch[1];
            // 逐个解析 Word 对象
            const wordRegex = /\{[^}]+\}/g;
            const wordMatches = wordsStr.match(wordRegex) || [];
            for (const wm of wordMatches) {
                const word = {};
                const wordMatch = wm.match(/Word:([^,}]*)/);
                if (wordMatch) word.word = wordMatch[1].trim();
                const accMatch = wm.match(/PronAccuracy:([-\d.]+)/);
                if (accMatch) word.accuracy = parseFloat(accMatch[1]);
                const tagMatch = wm.match(/Tag:(\d+)/);
                if (tagMatch) word.tag = parseInt(tagMatch[1]);
                const mbtmMatch = wm.match(/Mbtm:(\d+)/);
                if (mbtmMatch) word.mbtm = parseInt(mbtmMatch[1]);
                const metmMatch = wm.match(/Metm:(\d+)/);
                if (metmMatch) word.metm = parseInt(metmMatch[1]);
                if (word.word) result.words.push(word);
            }
        }
    } catch (e) {
        log(`解析结果出错: ${e.message}`, 'error');
    }

    return result;
}

// ============================================================
//  音频采集 & 发送
// ============================================================
async function startAudioCapture() {
    const stream = await navigator.mediaDevices.getUserMedia({
        audio: {
            channelCount: 1,
            sampleRate: 16000,
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
        }
    });
    mediaStream = stream;

    audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    sourceNode = audioContext.createMediaStreamSource(stream);

    // 使用 ScriptProcessor 采集音频（兼容性更好）
    scriptProcessor = audioContext.createScriptProcessor(4096, 1, 1);
    sourceNode.connect(scriptProcessor);
    scriptProcessor.connect(audioContext.destination);

    scriptProcessor.onaudioprocess = (e) => {
        if (!isRecording) return;
        const inputData = e.inputBuffer.getChannelData(0);

        // Float32 → Int16 PCM
        const pcmData = new Int16Array(inputData.length);
        for (let i = 0; i < inputData.length; i++) {
            const s = Math.max(-1, Math.min(1, inputData[i]));
            pcmData[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }

        // 放入队列
        audioBufferQueue.push(pcmData.buffer);

        // 实时波形绘制
        drawWaveform(inputData);
    };

    log('麦克风已开启，开始采集音频', 'success');
}

function sendAudioLoop() {
    if (!isRecording || !ws || ws.readyState !== WebSocket.OPEN) return;

    // 按 40ms 分片发送 (16kHz * 16bit * 40ms = 1280 bytes)
    const targetBytes = 1280;
    let buffer = new Uint8Array(0);

    while (audioBufferQueue.length > 0 && buffer.length < targetBytes * 2) {
        const chunk = new Uint8Array(audioBufferQueue.shift());
        const newBuf = new Uint8Array(buffer.length + chunk.length);
        newBuf.set(buffer, 0);
        newBuf.set(chunk, buffer.length);
        buffer = newBuf;
    }

    if (buffer.length > 0) {
        // 截取 1280 字节发送
        const sendBuf = buffer.length >= targetBytes
            ? buffer.slice(0, targetBytes)
            : buffer;
        ws.send(sendBuf.buffer);

        // 剩余的放回队列
        if (buffer.length > targetBytes) {
            audioBufferQueue.unshift(buffer.slice(targetBytes).buffer);
        }
    }

    // 继续循环
    setTimeout(sendAudioLoop, 40);
}

function stopAudioCapture() {
    if (scriptProcessor) {
        scriptProcessor.disconnect();
        scriptProcessor.onaudioprocess = null;
        scriptProcessor = null;
    }
    if (sourceNode) {
        sourceNode.disconnect();
        sourceNode = null;
    }
    if (audioContext) {
        audioContext.close().catch(() => {});
        audioContext = null;
    }
    if (mediaStream) {
        mediaStream.getTracks().forEach(t => t.stop());
        mediaStream = null;
    }
}

// ============================================================
//  波形绘制
// ============================================================
function drawWaveform(data) {
    if (!waveCanvas) return;
    const canvas = waveCanvas;
    const ctx = canvas.getContext('2d');
    const w = canvas.width = canvas.offsetWidth;
    const h = canvas.height = 60;
    const center = h / 2;

    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, w, h);

    // 计算 RMS 音量
    let sum = 0;
    for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
    const rms = Math.sqrt(sum / data.length);
    const volPercent = Math.min(100, rms * 500);

    // 绘制波形
    ctx.strokeStyle = '#3b82f6';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    const step = Math.ceil(data.length / w);
    for (let x = 0; x < w; x++) {
        let min = 1, max = -1;
        for (let j = 0; j < step && x * step + j < data.length; j++) {
            const v = data[x * step + j];
            if (v < min) min = v;
            if (v > max) max = v;
        }
        const y1 = center + min * center * 0.9;
        const y2 = center + max * center * 0.9;
        ctx.moveTo(x, y1);
        ctx.lineTo(x, y2);
    }
    ctx.stroke();

    // 音量条
    ctx.fillStyle = volPercent > 60 ? '#ef4444' : volPercent > 30 ? '#eab308' : '#22c55e';
    ctx.fillRect(4, h - 6, (w - 8) * (volPercent / 100), 3);
}

// ============================================================
//  录音控制
// ============================================================
async function startRecording() {
    const text = inputText.value.trim();
    if (!text && currentMode !== '3') {
        alert('⚠️ 请先输入测评内容！');
        return;
    }

    // 检查密钥
    if (!$('cfgAppId').value.trim() || !$('cfgSecretId').value.trim() || !$('cfgSecretKey').value.trim()) {
        alert('⚠️ 请先点击右上角「⚙️ 配置密钥」填写腾讯云密钥信息！\n\n获取地址：\nhttps://console.cloud.tencent.com/capi');
        $('configPanel').classList.add('open');
        return;
    }

    try {
        isRecording = true;
        btnRecord.disabled = true;
        btnRecord.innerHTML = '<span class="icon">⏹️</span> 停止录音';
        statusBadge.classList.remove('hidden');
        waveContainer.classList.remove('hidden');
        logArea.classList.remove('hidden');
        placeholder.classList.add('hidden');
        resultCard.classList.add('hidden');
        btnReport.disabled = true;

        // 重置结果
        evalResult = { totalScore: 0, pronunciationScore: 0, fluencyScore: 0, completenessScore: 0, words: [] };
        audioBufferQueue = [];

        // 构建 URL 并连接
        const wsUrl = buildWsUrl();
        log('正在连接腾讯云智聆评测服务...', 'info');
        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
            log('✅ WebSocket 连接成功，开始录音', 'success');
            startTime = Date.now();
        };

        ws.onmessage = (e) => {
            if (typeof e.data === 'string') {
                // 文本消息（JSON）
                try {
                    const json = JSON.parse(e.data);
                    handleWsMessage(json);
                } catch (err) {
                    log(`收到非JSON消息: ${e.data.substring(0, 100)}`, 'warn');
                }
            }
            // binary message 是服务端返回的数据，忽略
        };

        ws.onerror = (e) => {
            log(`WebSocket 错误: ${e.message || '未知错误'}`, 'error');
        };

        ws.onclose = (e) => {
            log(`WebSocket 已关闭 (code: ${e.code})`, 'info');
            if (isRecording) stopRecording();
        };

        // 等待连接打开后开始采集和发送
        await waitForWsOpen();
        await startAudioCapture();
        sendAudioLoop();

    } catch (err) {
        log(`启动失败: ${err.message}`, 'error');
        console.error(err);
        stopRecording();
        alert(`启动失败: ${err.message}\n\n请检查密钥配置和网络连接。`);
    }
}

function waitForWsOpen() {
    return new Promise((resolve, reject) => {
        const check = setInterval(() => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                clearInterval(check);
                resolve();
            } else if (ws && ws.readyState === WebSocket.CLOSED) {
                clearInterval(check);
                reject(new Error('WebSocket 连接被拒绝，请检查密钥和签名'));
            }
        }, 50);
        setTimeout(() => {
            clearInterval(check);
            reject(new Error('WebSocket 连接超时'));
        }, 10000);
    });
}

function handleWsMessage(json) {
    const { code, message, result, final } = json;

    if (code !== 0) {
        log(`❌ 错误 [${code}]: ${message}`, 'error');
        if (code === 4002) log('💡 提示：签名验证失败，请检查 SecretKey 是否正确', 'warn');
        if (code === 4003) log('💡 提示：服务未开通，请前往控制台开通智聆口语评测', 'warn');
        if (code === 4004) log('💡 提示：资源包已用完，请购买套餐包', 'warn');
        return;
    }

    if (result) {
        evalResult.rawResult = result;
        const parsed = parseResult(result);
        if (parsed.pronAccuracy > 0) evalResult.pronunciationScore = parsed.pronAccuracy;
        if (parsed.pronFluency > 0) evalResult.fluencyScore = parsed.pronFluency * 100;
        if (parsed.pronCompletion > 0) evalResult.completenessScore = parsed.pronCompletion * 100;
        if (parsed.suggestedScore !== 0) evalResult.totalScore = Math.max(0, Math.min(100, parsed.suggestedScore * 10 + 50));
        if (parsed.words.length > 0) evalResult.words = parsed.words;

        log(`📊 中间结果: 准确度=${parsed.pronAccuracy.toFixed(1)} 流畅度=${(parsed.pronFluency*100).toFixed(1)} 完整度=${(parsed.pronCompletion*100).toFixed(1)}`, 'info');
    }

    if (final === 1) {
        log('✅ 评测完成！', 'success');
        // 计算最终分数
        const scores = [evalResult.pronunciationScore, evalResult.fluencyScore, evalResult.completenessScore].filter(s => s > 0);
        if (scores.length > 0) {
            evalResult.totalScore = scores.reduce((a, b) => a + b, 0) / scores.length;
        }
        renderResult(evalResult);
        stopRecording();
    }
}

function stopRecording() {
    if (!isRecording) return;
    isRecording = false;

    // 发送结束标记
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'end' }));
        log('已发送 end 标记，等待最终结果...', 'info');
    }

    // 延迟关闭，等待最终结果的 message
    setTimeout(() => {
        stopAudioCapture();
        if (ws) {
            try { ws.close(); } catch(e) {}
            ws = null;
        }
        btnRecord.disabled = false;
        btnRecord.innerHTML = '<span class="icon">🎙️</span> 开始录音';
        statusBadge.classList.add('hidden');
        waveContainer.classList.add('hidden');
    }, 2000);
}

function getLevel(score) {
    if (score >= 90) return { label: '优秀', color: '#16a34a' };
    if (score >= 75) return { label: '良好', color: '#84cc16' };
    if (score >= 60) return { label: '及格', color: '#eab308' };
    return { label: '需努力', color: '#dc2626' };
}

function getWordClass(score) {
    if (score >= 90) return 'excellent';
    if (score >= 75) return 'good';
    if (score >= 60) return 'fair';
    return 'poor';
}

function renderResult(result) {
    placeholder.classList.add('hidden');
    resultCard.classList.remove('hidden');
    btnReport.disabled = false;
    btnPlay.disabled = false;

    const score = Math.round(result.totalScore || 0);
    const level = getLevel(score);
    const acc = Math.round(result.pronunciationScore || 0);
    const flu = Math.round(result.fluencyScore || 0);
    const comp = Math.round(result.completenessScore || 0);

    // 逐字结果
    let wordChipsHtml = '';
    if (result.words && result.words.length > 0) {
        wordChipsHtml = `
            <div class="word-results">
                <h4>📊 逐字评测结果</h4>
                <div class="word-grid">
                    ${result.words.map(w => {
                        const pinyin = PINYIN_MAP[w.word] || '';
                        const ws = Math.round(w.accuracy || 0);
                        return `
                            <div class="word-chip ${getWordClass(ws)}">
                                <span class="char">${w.word}</span>
                                <span class="pinyin">${pinyin}</span>
                                <span class="score" style="color:${getLevel(ws).color}">${ws}分</span>
                            </div>
                        `;
                    }).join('')}
                </div>
            </div>

    }

    // 建议
    const suggestions = generateSuggestions(result);

    const html = `

            </ul>
        </div>
    `;

    resultCard.innerHTML = html;
    lastResult = { ...result, level: level.label, levelColor: level.color, score, acc, flu, comp };

    log(`✅ 评测完成 - 总分: ${score} | 准确度: ${acc} | 流畅度: ${flu} | 完整度: ${comp}`, 'success');
}

function generateSuggestions(result) {
    const suggestions = [];
    const score = result.totalScore || 0;
    const acc = result.pronunciationScore || 0;

    if (result.words && result.words.length > 0) {
        const poorWords = result.words.filter(w => (w.accuracy || 0) < 70);
        if (poorWords.length > 0) {
            suggestions.push(`<span class="advice">重点练习：</span>${poorWords.map(w => `"${w.word}"(${Math.round(w.accuracy)}分)`).join('、')}`);
        }
    }

    if (acc < 70) {
        suggestions.push('<span class="advice">准确度较低：</span>注意声母发音部位，翘舌音(zh/ch/sh/r)舌尖要上翘抵住硬腭前部');
    } else if (acc < 85) {
        suggestions.push('<span class="advice">准确度待提升：</span>注意声调准确性，普通话四声要分明');
    }

    const flu = result.fluencyScore || 0;
    if (flu < 60) {
        suggestions.push('<span class="advice">流畅度不足：</span>尝试放慢语速，每个字发音完整后再接下一个字');
    }

    if (score >= 90) {
        suggestions.push('🎉 发音非常标准！可以尝试更长的段落或更快的语速挑战自己');
    } else if (score >= 70) {
        suggestions.push('💡 整体不错，针对低分字进行专项练习即可显著提升');
    } else {
        suggestions.push('💡 建议从单字开始练习，使用「标准发音」按钮反复跟读模仿');
    }

    return suggestions;
}

// ============================================================
//  事件绑定
// ============================================================

// 选项卡
document.querySelectorAll('.tab-btn').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentMode = tab.dataset.mode;
        const hints = {
            '0': '输入一个汉字，录音后评测单字发音',
            '1': '输入一句话，录音后评测句子发音',
            '2': '输入一段文字，录音后评测段落发音',
            '3': '自由说模式，无需输入文本，随意说一段话'
        };
        modeHint.textContent = hints[currentMode] || '';
        const placeholders = {
            '0': '例如：中',
            '1': '例如：我爱中国',
            '2': '例如：今天天气很好，我们去公园散步吧。',
            '3': '（自由说模式无需输入文本）'
        };
        inputText.placeholder = placeholders[currentMode] || '';
        inputText.disabled = currentMode === '3';
    });
});

// 录音按钮
btnRecord.addEventListener('click', () => {
    if (isRecording) {
        stopRecording();
    } else {
        startRecording();
    }
});

// 标准发音（TTS）
btnPlay.addEventListener('click', () => {
    const text = inputText.value.trim();
    if (!text) return;
    if ('speechSynthesis' in window) {
        speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'zh-CN';
        utter.rate = 0.85;
        utter.pitch = 1.0;
        // 尝试选择中文女声
        const voices = speechSynthesis.getVoices();
        const zhVoice = voices.find(v => v.lang === 'zh-CN' && v.name.includes('Female'));
        if (zhVoice) utter.voice = zhVoice;
        speechSynthesis.speak(utter);
        log('正在播放标准发音...', 'info');
    } else {
        alert('⚠️ 浏览器不支持语音合成');
    }
});

// 重置
btnReset.addEventListener('click', () => {
    if (isRecording) stopRecording();
    inputText.value = '';
    lightMarker.value = '';
    erhuaMarker.value = '';
    resultCard.classList.add('hidden');
    placeholder.classList.remove('hidden');
    btnReport.disabled = true;
    btnPlay.disabled = true;
    logArea.classList.add('hidden');
    logArea.innerHTML = '';
    evalResult = { totalScore: 0, pronunciationScore: 0, fluencyScore: 0, completenessScore: 0, words: [] };
    log('已重置', 'info');
});

// 配置面板
$('toggleConfig').addEventListener('click', () => {
    configPanel.classList.toggle('open');
});

// 从 localStorage 恢复配置
const saved = localStorage.getItem('tencentConfig');
if (saved) {
    try {
        const cfg = JSON.parse(saved);
        $('cfgAppId').value = cfg.appId || '';
        $('cfgSecretId').value = cfg.secretId || '';
        $('cfgSecretKey').value = cfg.secretKey || '';
    } catch(e) {}
}

// 保存配置到 localStorage
['cfgAppId', 'cfgSecretId', 'cfgSecretKey'].forEach(id => {
    $(id).addEventListener('change', saveConfig);
    $(id).addEventListener('blur', saveConfig);
});

function saveConfig() {
    const cfg = {
        appId: $('cfgAppId').value.trim(),
        secretId: $('cfgSecretId').value.trim(),
        secretKey: $('cfgSecretKey').value.trim()
    };
    localStorage.setItem('tencentConfig', JSON.stringify(cfg));
    log('配置已保存到本地', 'success');
}

// 报告
btnReport.addEventListener('click', () => {
    if (!lastResult) return;
    showReport(lastResult);
});

$('modalClose').addEventListener('click', () => reportModal.classList.remove('open'));
$('closeReport').addEventListener('click', () => reportModal.classList.remove('open'));
reportModal.addEventListener('click', e => { if (e.target === reportModal) reportModal.classList.remove('open'); });
$('printReport').addEventListener('click', () => window.print());
document.addEventListener('keydown', e => { if (e.key === 'Escape') reportModal.classList.remove('open'); });

function showReport(r) {
    const modeNames = { '0': '单字模式', '1': '句子模式', '2': '段落模式', '3': '自由说模式' };
    const html = `
        <div class="report-score" style="color:${r.levelColor};">${r.score}</div>
        <div class="report-level" style="color:${r.levelColor};">${r.level}</div>
        <div class="report-section">
            <h3>📊 评测详情</h3>
            <p><strong>测评文本：</strong>${inputText.value.trim() || '(自由说模式)'}</p>
            <p><strong>测评模式：</strong>${modeNames[currentMode] || ''}</p>
            <p><strong>准确度：</strong>${r.acc}分</p>
            <p><strong>流畅度：</strong>${r.flu}分</p>
            <p><strong>完整度：</strong>${r.comp}分</p>
        </div>
        <div class="report-section">
            <h3>💬 发音建议</h3>
            <p>${generateSuggestions(r).join('<br/>')}</p>
        </div>
        <div class="report-section">
            <h3>📅 报告信息</h3>
            <p><strong>生成时间：</strong>${new Date().toLocaleString('zh-CN')}</p>
            <p><strong>评测引擎：</strong>腾讯云智聆口语评测 (SOE)</p>
        </div>
    `;
    $('reportContent').innerHTML = html;
    reportModal.classList.add('open');
}

// 初始化
log('系统就绪。请先配置腾讯云密钥，然后输入文本开始评测。', 'info');
log('提示：使用 Chrome / Edge 浏览器，确保麦克风权限已开启。', 'warn');
