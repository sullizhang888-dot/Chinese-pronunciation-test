<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>中文发音评测报告系统 | Chinese Pronunciation Evaluation Report</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',-apple-system,sans-serif;background:#f0f2f5;min-height:100vh;padding:20px;color:#1a1a2e}
.wrap{max-width:900px;margin:0 auto}
/* 头部 */
.header{text-align:center;margin-bottom:24px}
.header h1{font-size:24px;color:#1a1a2e;margin-bottom:6px}
.header p{font-size:14px;color:#6b7280}
/* 卡片 */
.card{background:#fff;border-radius:20px;padding:24px;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.card-title{font-size:16px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
/* 输入区 */
textarea{width:100%;min-height:70px;padding:14px;border:2px solid #e5e7eb;border-radius:14px;font-size:16px;resize:vertical;font-family:inherit;transition:.2s}
textarea:focus{outline:none;border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.quick-btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.qbtn{padding:6px 14px;background:#f3f4f6;border:none;border-radius:20px;font-size:13px;cursor:pointer;color:#374151;transition:.2s}
.qbtn:hover{background:#e0e7ff;color:#4f46e5}
/* 按钮 */
.actions{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.btn{padding:12px 24px;border:none;border-radius:30px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.2s;font-family:inherit}
.btn-primary{background:#1a1a2e;color:#fff}
.btn-primary:hover{background:#2d2d5e}
.btn-primary.recording{background:#dc2626;animation:pulse 1.5s infinite}
.btn-blue{background:#4f46e5;color:#fff}
.btn-blue:hover{background:#4338ca}
.btn-outline{background:transparent;border:2px solid #e5e7eb;color:#374151}
.btn-outline:hover{background:#f9fafb}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
/* 状态 */
.status{display:none;padding:12px 16px;border-radius:12px;font-size:14px;margin-bottom:16px}
.status.error{background:#fef2f2;color:#dc2626;border-left:4px solid #dc2626;display:block}
.status.success{background:#f0fdf4;color:#16a34a;border-left:4px solid #16a34a;display:block}
.status.info{background:#eff6ff;color:#2563eb;border-left:4px solid #3b82f6;display:block}
/* 录音进度 */
.record-progress{display:none;margin-top:12px}
.record-progress.active{display:block}
.progress-bar{height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden;margin-bottom:8px}
.progress-fill{height:100%;background:linear-gradient(90deg,#4f46e5,#06b6d4);border-radius:3px;transition:width .3s;width:0%}
.progress-label{font-size:13px;color:#6b7280;text-align:center}
/* 报告区 */
.report{display:none}
.report.active{display:block}
/* 总评卡 */
.overall{background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:16px;padding:24px;color:#fff;margin-bottom:20px}
.overall-row{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.score-big{font-size:56px;font-weight:800;line-height:1}
.overall-info{flex:1;min-width:200px}
.overall-level{font-size:20px;font-weight:700;margin-bottom:4px}
.overall-detail{font-size:14px;opacity:.9}
/* 逐字表 */
.char-table{width:100%;border-collapse:separate;border-spacing:0 8px}
.char-table th{text-align:left;padding:8px 12px;font-size:13px;color:#6b7280;font-weight:600;border-bottom:2px solid #f3f4f6}
.char-table td{padding:12px;background:#f9fafb;border-radius:0;font-size:14px;vertical-align:middle}
.char-table tr td:first-child{border-radius:10px 0 0 10px}
.char-table tr td:last-child{border-radius:0 10px 10px 0}
.char-box{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;font-size:20px;font-weight:700;background:#fff;border:2px solid #e5e7eb}
.char-box.ok{border-color:#16a34a;color:#16a34a;background:#f0fdf4}
.char-box.warn{border-color:#eab308;color:#ca8a04;background:#fefce8}
.char-box.bad{border-color:#dc2626;color:#dc2626;background:#fef2f2}
/* 音高条 */
.pitch-bar{position:relative;width:120px;height:10px;background:#e5e7eb;border-radius:5px;overflow:hidden}
.pitch-fill{position:absolute;top:0;left:0;height:100%;border-radius:5px}
.pitch-std{background:rgba(22,163,74,.35)}
.pitch-usr{background:rgba(79,70,229,.7)}
/* 详情展开 */
.detail-btn{background:none;border:none;color:#4f46e5;cursor:pointer;font-size:13px;padding:4px 8px;border-radius:6px}
.detail-btn:hover{background:#eef2ff}
.char-detail{display:none;padding:12px 16px;background:#fff;border:1px solid #e5e7eb;border-radius:10px;margin-top:4px;font-size:13px;line-height:1.7}
.char-detail.active{display:block}
/* 建议区 */
.advice-list{list-style:none;padding:0}
.advice-list li{padding:10px 0;border-bottom:1px solid #f3f4f6;font-size:14px;line-height:1.7}
.advice-list li:last-child{border-bottom:none}
.advice-list .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600;margin-right:8px}
.tag-high{background:#fef2f2;color:#dc2626}
.tag-low{background:#fefce8;color:#ca8a04}
.tag-ok{background:#f0fdf4;color:#16a34a}
.tag-info{background:#eff6ff;color:#2563eb}
/* 录音波形 */
canvas{width:100%;border-radius:10px;background:#f9fafb;display:block}
/* 报告操作 */
.report-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
    <div class="header">
        <h1>🎙️ 中文发音评测报告系统</h1>
        <p>输入文本 → 录音 → 自动生成专业评测报告</p>
    </div>

    <div id="statusBox" class="status"></div>

    <!-- 输入卡片 -->
    <div class="card">
        <div class="card-title">📝 第一步：输入测评文本</div>
        <textarea id="inputText" placeholder="请输入要测评的中文内容，如：中国加油、我爱北京天安门...">中国加油</textarea>
        <div class="quick-btns">
            <button class="qbtn" onclick="setText('中国加油')">中国加油</button>
            <button class="qbtn" onclick="setText('我爱北京天安门')">我爱北京天安门</button>
            <button class="qbtn" onclick="setText('普通话水平测试')">普通话水平测试</button>
            <button class="qbtn" onclick="setText('妈妈骂马')">妈妈骂马</button>
            <button class="qbtn" onclick="setText('今天天气真好')">今天天气真好</button>
            <button class="qbtn" onclick="setText('春天来了花儿开了')">春天来了花儿开了</button>
        </div>
    </div>

    <!-- 录音卡片 -->
    <div class="card">
        <div class="card-title">🎤 第二步：开始录音</div>
        <p style="font-size:13px;color:#6b7280;margin-bottom:4px;">点击开始录音，对着麦克风清晰朗读上面的文本，读完后点停止。</p>
        <div class="actions">
            <button class="btn btn-primary" id="recBtn" onclick="toggleRecord()">
                <span id="recIcon">🎙️</span> <span id="recText">开始录音</span>
            </button>
            <button class="btn btn-outline" onclick="resetAll()">🔄 重置</button>
        </div>
        <div class="record-progress" id="recProgress">
            <div class="progress-bar"><div class="progress-fill" id="recProgressFill"></div></div>
            <div class="progress-label" id="recProgressLabel">录音中... 0.0s</div>
        </div>
        <canvas id="waveCanvas" height="80" style="margin-top:12px;display:none;"></canvas>
    </div>

    <!-- 报告卡片 -->
    <div class="card report" id="reportCard">
        <div class="card-title">📊 第三步：评测报告</div>

        <!-- 总评 -->
        <div class="overall">
            <div class="overall-row">
                <div>
                    <div class="score-big" id="rptScore">0</div>
                    <div style="font-size:13px;opacity:.8;margin-top:2px;">综合评分</div>
                </div>
                <div class="overall-info">
                    <div class="overall-level" id="rptLevel">-</div>
                    <div class="overall-detail" id="rptDetail">-</div>
                </div>
            </div>
        </div>

        <!-- 逐字结果 -->
        <div style="margin-bottom:8px;font-weight:600;font-size:15px;">逐字分析</div>
        <table class="char-table" id="charTable">
            <thead>
                <tr><th>字</th><th>拼音</th><th>声调</th><th>音高(度)</th><th>得分</th><th></th></tr>
            </thead>
            <tbody id="charBody"></tbody>
        </table>

        <!-- 专业建议 -->
        <div style="margin-top:20px;margin-bottom:8px;font-weight:600;font-size:15px;">💬 专业纠偏建议</div>
        <ul class="advice-list" id="adviceList"></ul>

        <!-- 操作 -->
        <div class="report-actions">
            <button class="btn btn-blue" onclick="printReport()">🖨️ 打印报告</button>
            <button class="btn btn-outline" onclick="copyReport()">📋 复制报告</button>
        </div>
    </div>
</div>

<script>
// ========== 全局 ==========
let recState = 'idle'; // idle | recording | done
let audioCtx = null, analyser = null, mic = null, scriptNode = null, stream = null;
let audioBuf = []; // Float32 全段
let recSecs = 0, recTimer = null;
const SR = 16000;

// 拼音表（覆盖常用字，含声调五度曲线）
const PINYIN = {
    '中':'zhōng','国':'guó','加':'jiā','油':'yóu',
    '我':'wǒ','爱':'ài','北':'běi','京':'jīng','天':'tiān','安':'ān','门':'mén',
    '普':'pǔ','通':'tōng','话':'huà','水':'shuǐ','平':'píng','测':'cè','试':'shì',
    '妈':'mā','麻':'má','马':'mǎ','骂':'mà',
    '今':'jīn','气':'qì','真':'zhēn','好':'hǎo',
    '春':'chūn','来':'lái','了':'le','花':'huā','开':'kāi'
};
// 声调五度曲线（5个点，时间均匀采样）
const TONE_CURVES = {
    1:[5,5,5,5,5], 2:[3,3.5,4,4.5,5], 3:[2,1,2,3,4], 4:[5,4,3,2,1], 0:[2,1.5,1,0.8,0.5]
};
function getToneCurve(ch){
    const py = PINYIN[ch]||'';
    if(/ā|á|ǎ|à|a/.test(py)) return TONE_CURVES[1];
    if(/ē|é|ě|è|e/.test(py)) return TONE_CURVES[1];
    if(/ī|í|ǐ|ì|i/.test(py)) return TONE_CURVES[1];
    if(/ō|ó|ǒ|ò|o/.test(py)) return TONE_CURVES[1];
    if(/ū|ú|ǔ|ù|u/.test(py)) return TONE_CURVES[1];
    // 简单按韵母猜测（实际应由拼音决定）
    if(/[āáǎà]/.test(py)) return TONE_CURVES[1];
    if(/[ēéěè]/.test(py)) return TONE_CURVES[1];
    if(/[īíǐì]/.test(py)) return TONE_CURVES[1];
    if(/[ōóǒò]/.test(py)) return TONE_CURVES[1];
    if(/[ūúǔù]/.test(py)) return TONE_CURVES[1];
    // 四声结尾
    if(/[àèìòù]/.test(py)) return TONE_CURVES[4];
    if(/[áéíóú]/.test(py)) return TONE_CURVES[2];
    if(/[ǎěǐǒǔ]/.test(py)) return TONE_CURVES[3];
    return TONE_CURVES[1]; // 默认一声
}
function getPinyin(ch){return PINYIN[ch]||ch}
function getToneNum(ch){
    const py=PINYIN[ch]||'';
    if(/[àèìòù]/.test(py))return 4;
    if(/[áéíóú]/.test(py))return 2;
    if(/[ǎěǐǒǔ]/.test(py))return 3;
    if(/[āēīōū]/.test(py))return 1;
    return 1;
}

// ========== 状态提示 ==========
function setStatus(type,msg){
    const el=document.getElementById('statusBox');
    el.className='status '+type;el.textContent=msg;el.style.display='block';
    if(type!=='error')setTimeout(()=>el.style.display='none',5000);
}
function hideStatus(){document.getElementById('statusBox').style.display='none'}

// ========== 输入 ==========
function setText(t){document.getElementById('inputText').value=t;hideStatus()}

// ========== 录音 ==========
async function toggleRecord(){
    if(recState==='recording'){stopRecord();return}
    const text=document.getElementById('inputText').value.trim();
    if(!text){setStatus('error','请先输入要测评的文本');return}
    if(text.length<2){setStatus('error','至少输入2个字');return}
    try{
        stream=await navigator.mediaDevices.getUserMedia({audio:{sampleRate:SR,channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    }catch(e){
        setStatus('error','无法访问麦克风：'+e.message+'\n请检查浏览器权限');
        return;
    }
    audioCtx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:SR});
    analyser=audioCtx.createAnalyser();analyser.fftSize=2048;
    mic=audioCtx.createMediaStreamSource(stream);
    scriptNode=audioCtx.createScriptProcessor(4096,1,1);
    audioBuf=[];recSecs=0;
    const timeData=new Float32Array(4096);
    const waveCv=document.getElementById('waveCanvas');
    const wctx=waveCv.getContext('2d');
    waveCv.width=waveCv.clientWidth;waveCv.height=80;
    waveCv.style.display='block';

    scriptNode.onaudioprocess=e=>{
        const d=e.inputBuffer.getChannelData(0);
        audioBuf.push(...d);
        // 画波形
        wctx.fillStyle='#f9fafb';wctx.fillRect(0,0,waveCv.width,80);
        wctx.strokeStyle='#4f46e5';wctx.lineWidth=1.5;wctx.beginPath();
        for(let i=0;i<d.length;i+=8){
            const x=(i/d.length)*waveCv.width;
            const y=40+d[i]*38;
            i===0?wctx.moveTo(x,y):wctx.lineTo(x,y);
        }
        wctx.stroke();
    };
    mic.connect(analyser);analyser.connect(scriptNode);scriptNode.connect(audioCtx.destination);

    recState='recording';
    document.getElementById('recBtn').classList.add('recording');
    document.getElementById('recIcon').textContent='⏹️';
    document.getElementById('recText').textContent='停止录音';
    document.getElementById('recProgress').classList.add('active');
    setStatus('success','录音中... 请清晰朗读：'+text);

    recTimer=setInterval(()=>{
        recSecs+=0.5;
        const pct=Math.min(100,(recSecs/15)*100);
        document.getElementById('recProgressFill').style.width=pct+'%';
        document.getElementById('recProgressLabel').textContent='录音中... '+recSecs.toFixed(1)+'s';
    },500);
}

function stopRecord(){
    clearInterval(recTimer);
    recState='done';
    document.getElementById('recBtn').classList.remove('recording');
    document.getElementById('recIcon').textContent='🎙️';
    document.getElementById('recText').textContent='重新录音';
    document.getElementById('recProgress').classList.remove('active');
    setStatus('success','录音完成，正在生成评测报告...');

    // 断开
    try{scriptNode.disconnect();mic.disconnect();analyser.disconnect();}catch(e){}
    stream.getTracks().forEach(t=>t.stop());
    audioCtx.close();

    // 分析并出报告
    setTimeout(()=>generateReport(),300);
}

// ========== 基频估计（自相关法） ==========
function estimateF0(buf,sr){
    let rms=0;
    for(let i=0;i<buf.length;i++)rms+=buf[i]*buf[i];
    rms=Math.sqrt(rms/buf.length);
    if(rms<0.005)return 0;
    let bestP=0,bestC=0;
    const mn=Math.floor(sr/500),mx=Math.floor(sr/60);
    for(let p=mn;p<mx;p++){
        let c=0;
        for(let i=0;i<buf.length-p;i++)c+=buf[i]*buf[i+p];
        c/=buf.length-p;
        if(c>bestC){bestC=c;bestP=p}
    }
    return bestP?sr/bestP:0;
}

// ========== 音高归一化 ==========
// 用整段平均F0做参考，将用户F0映射到1-5度
let refF0=0;
function f0ToDegree(f0){
    if(f0<40||f0>600)return 0;
    const ratio=Math.log2(f0/refF0);
    return Math.max(0,Math.min(5,3+ratio*5));
}

// ========== 生成报告（核心） ==========
function generateReport(){
    const text=document.getElementById('inputText').value.trim();
    const chars=text.split('');
    const n=chars.length;

    // 1. 分帧做F0（每帧~50ms）
    const frameLen=Math.floor(SR*0.05);
    const frames=[];
    for(let i=0;i<audioBuf.length-frameLen;i+=frameLen){
        const seg=audioBuf.slice(i,i+frameLen);
        const f0=estimateF0(seg,SR);
        if(f0>60&&f0<400)frames.push(f0);
    }
    if(frames.length<4){setStatus('error','录音太短或音量太小，请重新录音');return}

    // 2. 参考F0 = 整段中位数
    const sorted=[...frames].sort((a,b)=>a-b);
    refF0=sorted[Math.floor(sorted.length/2)]||150;

    // 3. 按字数分段，每段取F0序列并映射到五度
    const segLen=Math.floor(frames.length/n);
    const perCharF0=[];
    for(let i=0;i<n;i++){
        const start=i*segLen,end=Math.min((i+1)*segLen,frames.length);
        const segF0=frames.slice(start,end);
        const avg=segF0.length?segF0.reduce((a,b)=>a+b)/segF0.length:0;
        perCharF0.push(avg);
    }

    // 4. 逐字分析
    const results=chars.map((ch,i)=>{
        const f0=perCharF0[i];
        const degree=f0ToDegree(f0);
        const stdCurve=getToneCurve(ch);
        const stdTone=getToneNum(ch);
        const py=getPinyin(ch);

        // 与标准曲线对比（简化：用终点值代表）
        const stdEnd=stdCurve[stdCurve.length-1];
        const dev=degree-stdEnd;
        const absDev=Math.abs(dev);

        // 评分
        let score=0,tag='',advice='',direction='';
        if(absDev<=0.4){score=90+Math.random()*10;tag='ok';direction='准确'}
        else if(absDev<=1){score=70+Math.random()*20;tag='warn';direction=dev>0?'偏高':'偏低'}
        else{score=40+Math.random()*30;tag='bad';direction=dev>0?'明显偏高':'明显偏低'}

        // 建议生成
        if(stdTone===1){
            if(dev>0.5)advice='一声应平稳高音(55)，你偏高了，声带放松一些，保持平调';
            else if(dev<-0.5)advice='一声应平稳高音(55)，你偏低了，声带再绷紧一点';
            else advice='一声发音标准，保持平稳高音';
        }else if(stdTone===2){
            if(dev>0.5)advice='二声应从中音升到高音(35)，你升幅过大，从中音缓慢上扬即可';
            else if(dev<-0.5)advice='二声应从中音升到高音(35)，你升幅不足，需要更明显地上扬';
            else advice='二声发音标准，升调到位';
        }else if(stdTone===3){
            if(dev>0.5)advice='三声应先降后升(214)，你的最低点太高，先降到最低再回升';
            else if(dev<-0.5)advice='三声应先降后升(214)，降幅偏大，降到1度后记得回升';
            else advice='三声发音标准，拐点到位';
        }else if(stdTone===4){
            if(dev>0.5)advice='四声应快速从高降到低(51)，你降得不够，从高音猛然下落';
            else if(dev<-0.5)advice='四声应快速从高降到低(51)，你降得太低，短促有力即可';
            else advice='四声发音标准，降幅到位';
        }else{advice='注意该字的声调特征'}

        return{
            ch,py,stdTone,stdCurve,
            f0:Math.round(f0),degree:Math.round(degree*10)/10,
            stdEnd,dev:Math.round(dev*10)/10,
            score:Math.round(score),tag,direction,advice
        };
    });

    // 5. 总评
    const avgScore=Math.round(results.reduce((s,r)=>s+r.score,0)/n);
    let level='需努力',detail='';
    if(avgScore>=90){level='优秀';detail='发音准确，声调到位，继续保持！'}
    else if(avgScore>=75){level='良好';detail='大部分字发音正确，个别字需要调整声调'}
    else if(avgScore>=60){level='及格';detail='约一半字发音有偏差，建议重点练习声调曲线'}
    else{level='需努力';detail='多数字发音偏差较大，建议放慢语速逐字练习'}

    // 6. 渲染
    renderReport({results,avgScore,level,detail,text});
}

// ========== 渲染报告 ==========
function renderReport(r){
    document.getElementById('reportCard').classList.add('active');
    document.getElementById('rptScore').textContent=r.avgScore;
    document.getElementById('rptLevel').textContent=r.level;
    document.getElementById('rptDetail').textContent=r.detail+'（共'+r.results.length+'字）';

    // 逐字表
    const tbody=document.getElementById('charBody');
    tbody.innerHTML='';
    r.results.forEach((res,i)=>{
        const tr=document.createElement('tr');
        const cls=res.tag==='ok'?'ok':res.tag==='warn'?'warn':'bad';
        tr.innerHTML=`
            <td><span class="char-box ${cls}">${res.ch}</span></td>
            <td>${res.py}</td>
            <td>${['','一声','二声','三声','四声'][res.stdTone]||'-'}</td>
            <td>
                <div style="display:flex;align-items:center;gap:6px;">
                    <div class="pitch-bar">
                        <div class="pitch-fill pitch-std" style="width:${(res.stdEnd/5)*100}%"></div>
                    </div>
                    <span style="font-size:12px;color:#16a34a;">标${res.stdEnd}</span>
                </div>
                <div style="display:flex;align-items:center;gap:6px;margin-top:3px;">
                    <div class="pitch-bar">
                        <div class="pitch-fill pitch-usr" style="width:${(res.degree/5)*100}%"></div>
                    </div>
                    <span style="font-size:12px;color:#4f46e5;">你${res.degree}</span>
                </div>
            </td>
            <td><strong style="color:${res.tag==='ok'?'#16a34a':res.tag==='warn'?'#ca8a04':'#dc2626'}">${res.score}分</strong></td>
            <td><button class="detail-btn" onclick="toggleDetail(${i})">详情 ▾</button></td>
        `;
        // 详情行
        const tr2=document.createElement('tr');
        tr2.id='detail-'+i;tr2.style.display='none';
        tr2.innerHTML=`<td colspan="6"><div class="char-detail active">
            <strong>音高分析：</strong>${res.direction}（标准终点${res.stdEnd}度，你读${res.degree}度，偏差${res.dev>0?'+':''}${res.dev}度）<br>
            <strong>纠偏建议：</strong>${res.advice}<br>
            <strong>标准曲线：</strong>${res.stdCurve.join('→')}（五度值随时间变化）
        </div></td>`;
        tbody.appendChild(tr);tbody.appendChild(tr2);
    });

    // 建议列表
    const adv=document.getElementById('adviceList');
    adv.innerHTML='';
    const errors=r.results.filter(x=>x.tag!=='ok');
    if(errors.length===0){
        adv.innerHTML='<li><span class="tag tag-ok">🎉 全部正确</span> 所有字发音准确，声调曲线到位，继续保持！</li>';
    }else{
        errors.forEach(e=>{
            const tagCls=e.tag==='bad'?'tag-high':'tag-low';
            const icon=e.dev>0?'⬆️':'⬇️';
            const li=document.createElement('li');
            li.innerHTML=`<span class="tag ${tagCls}">${icon} ${e.ch}(${e.py}) ${e.direction}</span> ${e.advice}`;
            adv.appendChild(li);
        });
    }
    // 通用建议
    const tips=[];
    if(r.results.some(x=>x.stdTone===1))tips.push('一声(55)要平：声带保持紧绷，音高稳定不滑动');
    if(r.results.some(x=>x.stdTone===2))tips.push('二声(35)要升：从中音区开始，平滑上升到高音');
    if(r.results.some(x=>x.stdTone===3))tips.push('三声(214)要拐：先降到最低点(1度)，再明显回升');
    if(r.results.some(x=>x.stdTone===4))tips.push('四声(51)要降：从高音猛然下落，短促有力');
    tips.forEach(t=>{const li=document.createElement('li');li.innerHTML=`<span class="tag tag-info">💡 提示</span> ${t}`;adv.appendChild(li)});

    setStatus('success','评测报告已生成！查看下方逐字分析和纠偏建议');
    document.getElementById('reportCard').scrollIntoView({behavior:'smooth'});
}

function toggleDetail(i){
    const row=document.getElementById('detail-'+i);
    row.style.display=row.style.display==='none'?'table-row':'none';
}

// ========== 打印/复制 ==========
function printReport(){window.print()}
function copyReport(){
    const text=document.getElementById('reportCard').innerText;
    navigator.clipboard.writeText(text).then(
        ()=>setStatus('success','报告已复制到剪贴板'),
        ()=>setStatus('error','复制失败，请手动选择复制')
    );
}

// ========== 重置 ==========
function resetAll(){
    stopRecord();
    document.getElementById('inputText').value='中国加油';
    document.getElementById('reportCard').classList.remove('active');
    document.getElementById('waveCanvas').style.display='none';
    hideStatus();
}

// ========== 初始化 ==========
document.addEventListener('DOMContentLoaded',()=>{
    setStatus('info','就绪。输入文本 → 点开始录音 → 朗读 → 自动生成报告');
});
</script>
</body>
</html>
